<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"><title>NoteQuest nine-world expeditions</title><desc>Original world-route chart connecting nine independent NoteQuest music destinations. Concepts, not the playable map.</desc><defs><linearGradient id="sky" x2="0.2" y2="1"><stop stop-color="#1e2248"/><stop offset="1" stop-color="#38407a"/></linearGradient></defs><rect width="1600" height="900" fill="url(#sky)"/><text x="90" y="100" font-family="sans-serif" font-size="66" font-weight="800" fill="#fff8ed">Your musical expedition</text><text x="90" y="155" font-family="sans-serif" font-size="29" fill="#d8ddf8">Prove readiness • Pack your musical skills • Discover the next world</text><path d="M170 270 L785 270 L1400 270 L170 540 L785 540 L1400 540 L170 810 L785 810 L1400 810" fill="none" stroke="#f5c84c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 20"/><g transform="translate(170 270)"><circle r="80" fill="#9ed9e7" stroke="#fff8ed" stroke-width="9"/><text y="14" text-anchor="middle" fill="#2a2340" font-size="48" font-family="sans-serif" font-weight="800">1</text><rect x="-147" y="95" width="294" height="58" rx="21" fill="#fff8ed"/><text x="0" y="132" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#2a2340">Melody Harbor</text></g><g transform="translate(785 270)"><circle r="80" fill="#4b9f79" stroke="#fff8ed" stroke-width="9"/><text y="14" text-anchor="middle" fill="#2a2340" font-size="48" font-family="sans-serif" font-weight="800">2</text><rect x="-147" y="95" width="294" height="58" rx="21" fill="#fff8ed"/><text x="0" y="132" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#2a2340">Amazon Rainforest</text></g><g transform="translate(1400 270)"><circle r="80" fill="#dcad5d" stroke="#fff8ed" stroke-width="9"/><text y="14" text-anchor="middle" fill="#2a2340" font-size="48" font-family="sans-serif" font-weight="800">3</text><rect x="-