<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="cap-tracks">
<title id="cap-tracks">Original NoteQuest capybara forefoot and hindfoot print study v0.4</title>
<desc>Separate four toe marks for front foot, separate three toe marks for hind foot, each with a small elongated sole impression and no canine-style oversized central pad. Anatomical stylization, not traced reference.</desc>
