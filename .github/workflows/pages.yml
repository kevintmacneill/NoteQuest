name: Pages (live game + pull-request previews)
# Publishes the live game from main at the site root, and a playable preview of every open pull request at
# /preview/pr-<n>/ (its own save slot, in-browser tests at tests.html, plain results at test-results.txt).
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'   # also drops previews of closed pull requests
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      rc: ${{ steps.site.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # build_site.sh exit codes: 0 all passed; 3 site is safe to publish but a preview failed (published
      # anyway so it can be inspected, then the gate job below fails); anything else: do not publish.
      - name: Build site and previews
        id: site
        env: { GH_TOKEN: '${{ github.token }}', NQ_STATUS_FILE: '${{ runner.temp }}/nq-build-status.txt' }
        run: |
          set +e
          bash tools/preview/build_site.sh _site; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo "### Pages build (exit $rc)"; echo '```'; cat "$NQ_STATUS_FILE" 2>/dev/null; [ -s "$NQ_STATUS_FILE" ] || echo "main and all previews passed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cp "$NQ_STATUS_FILE" build-status.txt 2>/dev/null || : > build-status.txt
          if [ $rc -ne 0 ] && [ $rc -ne 3 ]; then echo "::error::site build failed (exit $rc); not publishing"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: build-status, path: build-status.txt }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Required failing check: the run is red unless main AND every open pull request preview passed and deployed.
  gate:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: build-status }
        continue-on-error: true
      - name: Main and every preview passed
        env: { RC: '${{ needs.build.outputs.rc }}', BUILD: '${{ needs.build.result }}', DEPLOY: '${{ needs.deploy.result }}' }
        run: |
          cat build-status.txt 2>/dev/null || true
          [ "$BUILD" = success ] || { echo "::error::site build job: $BUILD (exit ${RC:-none})"; exit 1; }
          [ "$DEPLOY" = success ] || { echo "::error::deploy job: $DEPLOY"; exit 1; }
          [ "$RC" = 0 ] || { echo "::error::published, but some pull request previews FAILED (exit $RC); see the list above"; exit 1; }
          echo "main and all previews passed and deployed"
