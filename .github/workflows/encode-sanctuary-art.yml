name: Encode Sanctuary art
on:
  push:
    branches: [chatgpt/sanctuary-webp-conversion]
    paths: [.github/workflows/encode-sanctuary-art.yml]
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Convert the two Sanctuary paintings
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cwebp >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y webp
          fi
          for area in pen hospital; do
            cwebp -quiet -q 80 -m 6 -resize 1280 0 "assets/nq-sanctuary-$area.png" -o "assets/nq-sanctuary-$area.webp"
            test "$(wc -c < "assets/nq-sanctuary-$area.webp")" -lt 640000
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nq-sanctuary-pen.webp assets/nq-sanctuary-hospital.webp
          git commit -m 'Encode the two Sanctuary paintings as WebP'
          git push origin "HEAD:$GITHUB_REF"
