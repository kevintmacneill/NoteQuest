<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Note Quest engine tests: running…</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#1E2248;color:#fff}
main{max-width:980px;margin:0 auto;padding:18px}
h1{font-size:24px;margin:0 0 4px}.sub{color:#D8DDF8;margin:0 0 14px}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:12px;border:0;background:#F5C84C;color:#3a2a00;cursor:pointer;margin:0 8px 8px 0}
button.alt{background:#34C6B3;color:#062f2a}
table{width:100%;border-collapse:collapse;background:#FFF8ED;color:#2A2340;border-radius:12px;overflow:hidden;margin:10px 0}
td,th{padding:8px 10px;border-bottom:1px solid #e8dcc8;text-align:left}th{background:#f3e6cf}
.pass{color:#0c7a54;font-weight:700}.fail{color:#c0392b;font-weight:700}.run{color:#8a6d00;font-weight:700}
pre{background:#11142e;color:#cfe;padding:12px;border-radius:10px;white-space:pre-wrap;max-height:420px;overflow:auto;font-size:13px}
#summary{font-size:20px;font-weight:700;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>Note Quest engine tests</h1>
<p class="sub">Runs the engine's own test suites inside this browser, using the engine from this preview's <code>index.html</code>. Every suite runs in a locked-down frame with its own temporary storage, so no saved game on this device is touched.</p>
<div><button id="runAll">Run all suites</button><button class="alt" id="fuzz">Stress test (random actions)</button><button class="alt" id="copy">Copy results as text</button></div>
<div id="summary">Loading…</div>
<table><thead><tr><th>Suite</th><th>Result</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table>
<h2 style="font-size:18px">Log</h2>
<pre id="log"></pre>
</main>
<script>
'use strict';
/* Results are also exposed for automated readers: window.NQ_TEST_RESULTS and the page title. */
/* Suites missing from a build are skipped, so older branches still pass. Keep in step with tests/run_engine_tests.sh. */
const SUITES=['engine_node.js','learn_node.js','pets_node.js','listen_node.js','theory_node.js','generators_node.js','early_types_node.js','journey_node.js'];
/* Data files some suites read beside themselves (tests/<name>); loaded when present. */
const DATA_FILES=['generator_contract_v32.json'];
const FUZZ='fuzz_node.js';
const $=s=>document.querySelector(s);
const logEl=$('#log'),rows=$('#rows');
const results={};window.NQ_TEST_RESULTS=results;
function log(t){logEl.textContent+=t+'\n';logEl.scrollTop=logEl.scrollHeight}
async function text(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url+' → '+r.status);return r.text()}
let ENGINE=null,SYNTH='';const DATA={};
async function load(){const html=await text('index.html');const m=html.match(/<script id="nq-engine">\n([\s\S]*?)\n<\/script>/);if(!m)throw new Error('no engine block in index.html');ENGINE=m[1].replace(/const KEY='noteQuest\.preview\.[^']*'/,"const KEY='noteQuest.v1'"); /* previews use their own save key; tests stub storage anyway */
  try{SYNTH=await text('tests/synth.js')}catch(e){SYNTH=''}
  for(const f of DATA_FILES){try{DATA[f]=await text('tests/'+f)}catch(e){}}
  const v=(ENGINE.match(/const VERSION='([^']+)'/)||[])[1]||'?';$('#summary').textContent='Engine '+v+' loaded. Ready.';}
/* Shim so the Node test files run unchanged in a sandboxed (opaque-origin) iframe */
const SHIM=`
(function(){
  const send=m=>parent.postMessage(Object.assign({nqtest:SUITE},m),'*');
  const out=[];const say=(...a)=>{const s=a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ');out.push(s);send({type:'log',line:s})};
  console.log=say;console.error=say;console.warn=say;
  Object.defineProperty(window,'localStorage',{value:{getItem:()=>null,setItem:()=>{}},writable:true,configurable:true});
  Object.defineProperty(window,'navigator',{value:{},writable:true,configurable:true});
  /* the Node tests fake these; make them assignable in the browser too (this frame is isolated) */
  Object.defineProperty(window,'isSecureContext',{value:window.isSecureContext,writable:true,configurable:true});
  try{Object.defineProperty(document,'permissionsPolicy',{value:null,writable:true,configurable:true});Object.defineProperty(document,'featurePolicy',{value:null,writable:true,configurable:true})}catch(e){}
  window.global=window;
  const _btoa=window.btoa.bind(window),_atob=window.atob.bind(window);
  window.Buffer={from:(s,enc)=>({toString:(to)=>{if(enc==='base64'&&to==='binary')return _atob(s);if(to==='base64')return _btoa(s);return String(s)}})};
  const FILES=Object.assign({ENGINE_PATH:ENGINE_SRC},DATA_SRC);
  window.__dirname='tests';
  window.require=function(name){
    if(name==='path')return {join:(...p)=>p.filter(Boolean).join('/'),basename:p=>String(p).split('/').pop()};
    if(name==='fs')return {readFileSync:(p)=>{if(p in FILES)return FILES[p];const b=String(p).split('/').pop();if(b in FILES)return FILES[b];throw new Error('no file '+p)}};
    if(name==='vm')return {runInThisContext:(src)=>(0,eval)(src),runInNewContext:(src,ctx)=>{const f=new Function(...Object.keys(ctx),src);return f(...Object.values(ctx))},createContext:c=>c};
    if(name==='./synth.js'){const module={exports:{}};(new Function('module','exports','require',SYNTH_SRC))(module,module.exports,window.require);return module.exports}
    throw new Error('require '+name+' not available in browser');
  };
  class Stop extends Error{}
  window.process={argv:['node',SUITE,'ENGINE_PATH',...EXTRA_ARGS],env:{},exit:(code)=>{send({type:'done',code:code||0});throw new Stop('exit')}};
  window.addEventListener('error',e=>{if(e.error instanceof Stop||String(e.message).includes('exit')){e.preventDefault();return}send({type:'log',line:'ERROR: '+e.message});send({type:'done',code:1})});
  window.addEventListener('unhandledrejection',e=>{send({type:'log',line:'ERROR: '+(e.reason&&e.reason.message||e.reason)});send({type:'done',code:1})});
})();`;
function runSuite(name,src,extra=[]){return new Promise(resolve=>{const t0=performance.now();const row=document.createElement('tr');row.innerHTML=`<td>${name}</td><td class="run">running…</td><td></td>`;rows.appendChild(row);
  const f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts');f.style.display='none';
  const esc=s=>JSON.stringify(s).replace(/<\//g,'<\\/');
  const shim=SHIM.replace('SUITE',esc(name)).replace("{ENGINE_PATH:ENGINE_SRC}",()=>"{ENGINE_PATH:"+esc(ENGINE)+"}").replace('SYNTH_SRC',()=>esc(SYNTH)).replace('DATA_SRC',()=>esc(DATA)).replace("'ENGINE_PATH',...EXTRA_ARGS",()=>"'ENGINE_PATH',..."+esc(extra));
  /* function replacements: sources may contain "$&"-style patterns that a string replacement would expand */
  f.srcdoc='<!doctype html><meta charset="utf-8"><script>const SUITE='+esc(name)+';'+shim.replace(/<\/script/gi,'<\\/script')+'<\/script><script>'+src.replace(/<\/script/gi,'<\\/script')+'\n;setTimeout(()=>parent.postMessage({nqtest:'+esc(name)+',type:"done",code:0},"*"),0)<\/script>';
  const lines=[];let finished=false;
  const onMsg=e=>{const d=e.data;if(!d||d.nqtest!==name)return;if(d.type==='log'){lines.push(d.line);log('['+name+'] '+d.line)}
    if(d.type==='done'&&!finished){if(!lines.some(l=>/passed, \d+ failed/.test(l))&&d.code===0)return;finished=true;window.removeEventListener('message',onMsg);clearTimeout(timer);f.remove();
      const sum=lines.filter(l=>/passed, \d+ failed/.test(l)).pop()||'no summary';const fails=lines.filter(l=>l.startsWith('FAIL')||l.startsWith('ERROR'));const ok=d.code===0&&!fails.length;
      const ms=Math.round(performance.now()-t0);row.children[1].className=ok?'pass':'fail';row.children[1].textContent=(ok?'PASS ':'FAIL ')+sum;row.children[2].textContent=(ms/1000).toFixed(1)+' s';
      results[name]={ok,summary:sum,failures:fails,ms};resolve(results[name])}};
  window.addEventListener('message',onMsg);
  const timer=setTimeout(()=>{if(finished)return;finished=true;window.removeEventListener('message',onMsg);f.remove();row.children[1].className='fail';row.children[1].textContent='FAIL timeout';results[name]={ok:false,summary:'timeout',failures:['timeout'],ms:180000};resolve(results[name])},180000);
  document.body.appendChild(f)})}
async function runList(list,extra){$('#summary').textContent='Running…';document.title='Note Quest engine tests: running…';
  for(const s of list){let src;try{src=await text('tests/'+s)}catch(e){log('skip '+s+' (not in this build)');continue}await runSuite(s,src,extra)}
  const all=Object.values(results);const bad=all.filter(r=>!r.ok).length;const line=bad?`${bad} suite(s) FAILED`:`ALL ${all.length} SUITES PASSED`;
  $('#summary').textContent=line;$('#summary').className=bad?'fail':'pass';document.title='Note Quest engine tests: '+line;window.NQ_TEST_DONE=true}
function asText(){return Object.entries(results).map(([k,r])=>`${r.ok?'PASS':'FAIL'}  ${k}  ${r.summary}${r.failures.length?'\n    '+r.failures.join('\n    '):''}`).join('\n')}
$('#runAll').onclick=()=>{rows.innerHTML='';logEl.textContent='';for(const k in results)delete results[k];runList(SUITES)};
$('#fuzz').onclick=()=>{const n=prompt('How many random actions?','5000');if(!n)return;runList([FUZZ],[String(+n||5000)])};
$('#copy').onclick=async()=>{const t=asText();try{await navigator.clipboard.writeText(t);alert('Copied')}catch(e){log(t)}};
load().then(()=>{if(new URLSearchParams(location.search).has('autorun')||location.hash==='#run')runList(SUITES.concat(new URLSearchParams(location.search).has('fuzz')?[FUZZ]:[]))}).catch(e=>{$('#summary').textContent='Could not load: '+e.message});
</script>
</body>
</html>
