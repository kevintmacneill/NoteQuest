const petIcon=s=>hasRig(s.id)?`<span class="rigicon">${RIGS[s.id]()}</span>`:s.i;
function growNote(pet){const g=NQ.pets.growInfo(pet);if(g.stage==='egg')return `🥚 Egg · hatches after ${g.roundsLeft} more music round${g.roundsLeft===1?'':'s'}`;if(g.stage==='adult')return 'All grown up!';return `${STAGE_NAME[g.stage]} · grows up in about ${g.daysLeft} day${g.daysLeft>1?'s':''} of good care`}
function moodCls(p,pet){return NQ.pets.moods(pet).map(m=>' mood-'+m).join('')}
function namePrompt(def,title,cb){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="ovc"><h2>${title}</h2><input class="txt" id="pn" maxlength="14" value="${esc(def)}" autocomplete="off"><div class="row" style="margin-top:16px"><button class="btn" data-r="ok">Done</button></div></div>`;document.body.appendChild(ov);
  const i=ov.querySelector('#pn');setTimeout(()=>{i.focus();i.select()},50);ov.addEventListener('click',e=>{if(e.target.closest('[data-r]')){const v=i.value.trim()||def;ov.remove();cb(v)}})}
function hearts(el){if(!el)return;const h=document.createElement('div');h.className='hearts';h.textContent='💖';el.appendChild(h);setTimeout(()=>h.remove(),700)}

VIEWS.starter=()=>{const p=NQ.pets.init();const bonus=NQ.pets.starterBonus();
  app.innerHTML=`${topBar('Welcome, '+esc(p.name)+'!','profiles')}<div style="text-align:center"><h2 style="font-size:30px;margin:6px 0">Pick your first pet!</h2><p class="note-tip" style="font-size:18px">Practice music to earn 🪙 coins, then buy food, toys and more pets.${totalStars(p)?`<br>You already earned ⭐ ${totalStars(p)} stars, so here are <b>${bonus} coins</b> to start!`:''}</p>
   <div class="grid" style="margin-top:16px">${NQ.content.STARTER_PETS.map(id=>{const s=SPM[id];return `<button class="tile" data-st="${id}"><div class="ic">${petIcon(s)}</div><div class="nm">${s.n}</div><div class="sub">Lives in the ${HABS[s.hab].n} ${HABS[s.hab].i}</div></button>`}).join('')}</div></div>`;
  app.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click',()=>{const s=SPM[b.dataset.st];namePrompt(s.n,'Name your '+s.n.toLowerCase(),name=>{
    NQ.pets.chooseStarter(s.id,name);go('home')})}));
};
VIEWS.home=()=>{const p=P();if(!p)return go('profiles');NQ.pets.init();if(!p.starterDone)return go('starter');
  let hab=NQ.pets.habitat();NQ.pets.genMess(hab);let deco=false;
  app.innerHTML=`${topBar(HABS[hab].i+' '+HABS[hab].n,'profiles')}
   <div class="habtabs">${HAB_ORDER.filter(h=>p.habs.includes(h)||!HABS[h].noBuy).map(h=>p.habs.includes(h)?`<button class="htab ${h===hab?'on':''}" data-h="${h}">${HABS[h].i} ${HABS[h].n}</button>`:`<button class="htab lockd" data-go="shop|habs">🔒 ${HABS[h].i}</button>`).join('')}</div>
   <div class="hab hab-${hab}" id="hab" style="background:${HAB_BG[hab]}"></div>
   <div id="tray"></div>
   <div class="row hab-actions"><button class="btn play" data-go="games">▶ Play</button><button class="btn alt" data-go="map">🗺️ Expeditions</button><button class="btn alt" data-go="shop">🛒 Shop</button><button class="btn ghost" id="decoB">🎨 Decorate</button><button class="btn ghost" data-go="journal">📔 Journal</button></div>
   <p class="note-tip" id="habTip"></p>`;
  const el=$('#hab');
  function tip(){const pets=p.pets.filter(x=>x.hab===hab);const m=NQ.pets.messes(hab).length;const hungry=pets.filter(x=>need(x,'h')<45).length;
    $('#habTip').textContent=!pets.length?'No pets live here yet. Visit the shop to adopt one!':m?`Uh oh, ${m} mess${m>1?'es':''} to clean up! Tap to scoop.`:hungry?`${hungry} pet${hungry>1?'s are':' is'} hungry. Tap a pet to feed it.`:'Everyone is happy! Tap a pet to say hi.'}
  function render(){let h=habBG(hab);
    p.decor.filter(d=>d.hab===hab).forEach(d=>{h+=`<div class="deco" data-d="${d.id}" style="left:${d.x}%;top:${d.y}%">${d.i}</div>`});
    NQ.pets.messes(hab).forEach(m=>{h+=`<div class="mess" data-m="${m.id}" style="left:${m.x}%;top:${m.y}%">${m.i}</div>`});
    p.pets.filter(x=>x.hab===hab).forEach((pet,i)=>{const s=SPM[pet.sp];const grew=NQ.pets.growUpdate(pet);if(grew)setTimeout(()=>{toast(`🎉 ${pet.name} grew into a ${STAGE_NAME[grew].toLowerCase()}!`,3000);confetti()},400);
      const ln=NQ.pets.lowestNeed(pet);
      const bub=ln?{h:'🍽️',c:'🧼',j:'🎾'}[ln]:'';const mood=moodCls(p,pet);const rig=hasRig(pet.sp);
      h+=`<div class="pet st-${stageOf(pet)}${mood}" data-p="${pet.id}" data-sp="${pet.sp}" style="left:${pet._x||(14+((i*23)%72))}%;top:${pet._y||(62+((i*13)%24))}%">${bub?`<div class="bub">${bub}</div>`:''}${mood.includes('sleepy')?'<div class="zz">💤</div>':''}<div class="pi ${rig?'rigpi':'emopi'}" style="${pet._f?'transform:scaleX(-1)':''}">${pet.egg?'<span class="emo">🥚</span>':rig?RIGS[pet.sp]():`<span class="emo">${s.i}</span>`}</div><div class="pn">${esc(pet.name)}${pet.egg?` 🥚${NQ.pets.display(pet).hatchRoundsLeft}`:''}</div></div>`});
    el.innerHTML=h;el.classList.toggle('decomode',deco);tip()}
  render();
  const wander=setInterval(()=>{if(deco)return;el.querySelectorAll('.pet').forEach(pe=>{if(Math.random()<.45)return;const pet=p.pets.find(x=>x.id===pe.dataset.p);if(!pet||pet.egg)return;
    if(pe.classList.contains('busy'))return;const x=parseFloat(pe.style.left),nx=Math.max(8,Math.min(92,x+(Math.random()*44-22))),ny=hab==='spring'?68+Math.random()*20:hab==='pond'&&!['duck'].includes(pet.sp)?48+Math.random()*40:56+Math.random()*32;
    if(pe.classList.contains('busy'))return;pet._x=nx;pet._y=ny;pet._f=nx>x;pe.style.left=nx+'%';pe.style.top=ny+'%';pe.querySelector('.pi').style.transform=nx>x?'scaleX(-1)':'scaleX(1)';pe.classList.add('walking');clearTimeout(pe._wt);pe._wt=setTimeout(()=>pe.classList.remove('walking'),2400)})},2600);
  const messTimer=setInterval(()=>{if(NQ.pets.genMess(hab))render()},60000);
  cleanup=()=>{clearInterval(wander);clearInterval(messTimer)};
  el.addEventListener('click',e=>{if(deco)return;const m=e.target.closest('.mess');if(m){const cr=NQ.pets.cleanMess(hab,m.dataset.m);if(!cr.ok){toast(cr.reason==='no-bags'?'Out of cleaning bags! Get more in the shop 🛒 (Care tab).':'Can’t clean that right now.');return}m.classList.add('gone');playMidi(84,.25,0,.12);playMidi(91,.3,.06,.1);setTimeout(()=>{render()},250);return}
    const pe=e.target.closest('.pet');if(pe){const pet=p.pets.find(x=>x.id===pe.dataset.p);if(pet)petSheet(pet,render,(action)=>petAct(pe,pet,action))}});
  app.querySelectorAll('[data-h]').forEach(b=>b.addEventListener('click',()=>{NQ.pets.setHabitat(b.dataset.h);go('home')}));
  // decorate mode
  function drawTray(){if(!deco){$('#tray').innerHTML='';return}const T=NQ.decor.tray();
    const shopItems=T.shop.map(x=>[x.i,x.n]);const stk=T.stickers;
    $('#tray').innerHTML=`<div class="tray-h">Tap an item to add it. Drag items to move them. Tap a placed item to put it back. <button class="pbtn" id="decoDone">Done</button></div><div class="tray">${shopItems.map(([i,n])=>`<button data-ti="${i}" data-src="shop">${i}<small>${n}</small></button>`).join('')}${stk.map(s=>`<button data-ti="${s}" data-src="sticker">${s}<small>sticker</small></button>`).join('')}${!shopItems.length&&!stk.length?'<span style="padding:8px;color:var(--dim)">No decorations yet. Buy some in the shop or earn stickers by playing!</span>':''}</div>`;
    $('#tray').querySelectorAll('[data-ti]').forEach(b=>b.addEventListener('click',()=>{NQ.decor.place(b.dataset.ti,b.dataset.src,hab);render();drawTray()}));
    $('#decoDone').addEventListener('click',()=>{deco=false;render();drawTray()})}
  $('#decoB').addEventListener('click',()=>{deco=!deco;render();drawTray()});
  let drag=null;
  el.addEventListener('pointerdown',e=>{if(!deco)return;const d=e.target.closest('.deco');if(!d)return;e.preventDefault();const r=el.getBoundingClientRect();drag={d,id:d.dataset.d,sx:e.clientX,sy:e.clientY,moved:false,r};try{d.setPointerCapture(e.pointerId)}catch(x){}});
  el.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6)drag.moved=true;if(!drag.moved)return;const x=Math.max(3,Math.min(97,(e.clientX-drag.r.left)/drag.r.width*100)),y=Math.max(12,Math.min(99,(e.clientY-drag.r.top)/drag.r.height*100+6));drag.d.style.left=x+'%';drag.d.style.top=y+'%';drag.x=x;drag.y=y});
  el.addEventListener('pointerup',()=>{if(!drag)return;if(drag.moved&&drag.x!=null)NQ.decor.move(drag.id,drag.x,drag.y);else NQ.decor.remove(drag.id);drag=null;render();drawTray()});
};
function petSheet(pet,after,inHab){const p=P();const ov=document.createElement('div');ov.className='ov';document.body.appendChild(ov);let sub='';
  function draw(){const s=SPM[pet.sp];const tool=CLEAN_TOOL[pet.hab];
    const bars=[['🍽️','Full','h'],['🎾','Happy','j'],['🧼','Clean','c']].map(([i,n,k])=>{const v=Math.round(k==='j'?joyShown(p,pet):need(pet,k));return `<div class="nb"><span>${i} ${n}</span><div class="bar"><i style="width:${v}%;background:${v>60?'#2bbf7a':v>30?'#f5b700':'#ff5d7a'}"></i></div></div>`}).join('');
    let subH='';
    if(sub==='feed'){const foods=s.diet;const have=foods.filter(f=>(p.inv[f]||0)>0);
      subH=`<div class="foods">${foods.map(f=>`<button data-f="${f}" ${(p.inv[f]||0)?'':'disabled'}>${FOODS[f].i}${f===s.fav?'<b class="fav">❤️</b>':''}<small> ×${p.inv[f]||0}</small></button>`).join('')}</div>${have.length?`<div class="note-tip">❤️ = ${esc(pet.name)}’s favorite</div>`:`<div class="note-tip">No food ${esc(pet.name)} eats. Buy ${foods.map(f=>FOODS[f].i).join(' ')} in the shop!</div><button class="btn small alt" data-a="shop">🛒 Go to shop</button>`}`}
    const hasToy=p.tools.includes('toy'),hasTool=p.tools.includes(tool);
    ov.innerHTML=`<div class="ovc sheet"><div class="big st-${stageOf(pet)}${moodCls(p,pet)}" id="pbig">${pet.egg?'<span class="emo">🥚</span>':hasRig(pet.sp)?RIGS[pet.sp]():`<span class="emo">${s.i}</span>`}</div><h2>${esc(pet.name)} <button class="mini" data-a="rn">✏️</button></h2><div class="sub2">${s.n} · ${rarity(s.c||2000)}${pet.sp==='caterpillar'?` · ${8-pet.meals} more meals until it becomes a butterfly!`:''}</div><div class="grow">${growNote(pet)}</div>${bars}
      <div class="acts"><button data-a="feed">🍽️<br>Feed</button><button data-a="play" class="${hasToy?'':'need'}">🎾<br>Play</button><button data-a="clean" class="${hasTool?'':'need'}">${TOOLS[tool].i}<br>Clean</button><button data-a="pet">🤚<br>Pet</button></div>${subH}<div class="note-tip" id="sMsg"></div><button class="btn" data-a="close" style="margin-top:10px">Close</button></div>`}
  const msg=t=>{const m=ov.querySelector('#sMsg');if(m)m.textContent=t};
  draw();
  ov.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){const id=f.dataset.f;const food=FOODS[id];const r=NQ.pets.feed(pet,id);if(!r.ok){if(r.reason==='egg')msg('It’s still an egg! Finish music rounds to hatch it.');return}const evolved=r.evolved;
      draw();eatAnim(ov.querySelector('#pbig'),food.i);msg(evolved?'🎉 Your caterpillar turned into a butterfly!':r.fav?'Yum! That’s the favorite!':'Yum!');if(evolved)confetti();return}
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;const tool=CLEAN_TOOL[pet.hab];
    if(a==='close'){ov.remove();after&&after();return}
    if(a==='shop'){ov.remove();go('shop','food');return}
    if(a==='rn'){namePrompt(pet.name,'Rename',v=>{NQ.pets.rename(pet,v);draw()});return}
    if(a==='feed'){sub=sub==='feed'?'':'feed';draw();return}
    if(a==='play'){const pr=NQ.pets.play(pet);if(!pr.ok){msg(pr.reason==='egg'?'It’s still an egg!':pr.reason==='sleeping'?`Shh… ${esc(pet.name)} is sleeping. Tap 🤚 Pet to wake them.`:'Buy a 🎾 play ball in the shop to play!');return}ov.remove();if(inHab)inHab('play');else after&&after();return}
    if(a==='clean'){const cr=NQ.pets.clean(pet);if(!cr.ok){msg(cr.reason==='no-soap'?'Out of soap! Get more in the shop (🧼 Care tab). Play a music game to earn coins.':cr.reason==='sleeping'?`Shh… ${esc(pet.name)} is sleeping. Tap 🤚 Pet to wake them.`:cr.reason==='egg'?'It’s still an egg!':`Buy the ${TOOLS[tool].i} ${TOOLS[tool].n.toLowerCase()} in the shop to clean ${esc(pet.name)}.`);return}draw();hearts(ov.querySelector('#pbig'));playMidi(88,.3,0,.15);msg('Squeaky clean! ✨');return}
    if(a==='pet'){const big=ov.querySelector('#pbig');if(NQ.pets.display(pet).condition==='sleeping'){NQ.pets.wake(pet);draw();msg(`${esc(pet.name)} woke up! 🌅`);return}const pr=NQ.pets.pat(pet);const roll=pr.rolls;if(pr.boosted)draw();const b2=ov.querySelector('#pbig');b2.classList.add(roll?'rolled':'hop');setTimeout(()=>b2.classList.remove('rolled','hop'),roll?2200:600);hearts(b2);msg(roll?`${esc(pet.name)} rolled into a little ball! 😊`:`${esc(pet.name)} loves you!`)}});
}
function eatAnim(big,icon){if(!big)return;big.classList.add('eating');const f=document.createElement('div');f.className='foodbit';f.textContent=icon;big.appendChild(f);
  [0,450,900,1350].forEach(t=>setTimeout(()=>playMidi(72+Math.floor(Math.random()*5),.12,0,.08),t));setTimeout(()=>{big.classList.remove('eating');f.remove();hearts(big);sfxGood()},1850)}
function petAct(pe,pet,action){const hab=document.getElementById('hab');if(!hab||!pe)return;
  if(action==='play'){pe.classList.add('busy','mood-happy');const ball=document.createElement('div');ball.className='toyball';hab.appendChild(ball);let n=0;
    const hop=()=>{if(!document.body.contains(pe)){ball.remove();return}const bx=10+Math.random()*80,by=64+Math.random()*24;ball.style.left=bx+'%';ball.style.top=by+'%';playMidi(76,.15,0,.12);
      setTimeout(()=>{const x=parseFloat(pe.style.left);pe.querySelector('.pi').style.transform=bx>x?'scaleX(-1)':'scaleX(1)';pet._f=bx>x;pe.classList.add('walking','running');pe.style.left=bx+'%';pe.style.top=(by+3)+'%';pet._x=bx;pet._y=by+3},350);
      setTimeout(()=>{pe.classList.remove('walking','running');pe.classList.add('hop');setTimeout(()=>pe.classList.remove('hop'),500);if(++n<4)setTimeout(hop,500);else setTimeout(()=>{ball.remove();pe.classList.remove('busy');hearts(pe)},700)},2000)};
    hop()}}
VIEWS.shop=(tab)=>{const p=NQ.pets.init();tab=tab||'food';
  function card(ic,nm,price,id,kind,extra){const can=p.coins>=price;return `<div class="sitem ${can?'':'dis'}"><div class="ic">${ic}</div><div class="nm">${nm}</div>${extra||''}<div class="pr">🪙 ${price}</div><button class="btn small ${can?'':'ghost'}" data-buy="${kind}|${id}">${can?'Buy':'Need '+(price-p.coins)+' more'}</button></div>`}
  function draw(){let h='';
    if(tab==='food')h=Object.entries(FOODS).map(([id,f])=>card(f.i,f.n,f.c,id,'food',`<div class="sub2">You have ${p.inv[id]||0}</div>`)).join('');
    if(tab==='pets')h=HAB_ORDER.filter(x=>!HABS[x].noBuy).map(hab=>`<div class="sec-h" style="grid-column:1/-1">${HABS[hab].i} ${HABS[hab].n}${p.habs.includes(hab)?` · ${p.pets.filter(x=>x.hab===hab).length}/${MAX_PETS} pets`:' · 🔒 buy this habitat first'}</div>`+SPECIES.filter(s=>s.hab===hab&&!s.hidden).map(s=>p.habs.includes(hab)?card(petIcon(s),s.n,s.c,s.id,'pet',`<div class="sub2">${rarity(s.c)}${s.id==='caterpillar'?' · grows into 🦋':''}</div>`):`<div class="sitem dis"><div class="ic">${petIcon(s)}</div><div class="nm">${s.n}</div><div class="pr">🪙 ${s.c}</div><div class="sub2">Needs the ${HABS[hab].n}</div></div>`).join('')).join('');
    if(tab==='decor')h=DECOR.map(([i,n,c])=>card(i,n,c,i,'decor',`<div class="sub2">You have ${NQ.decor.owned(i)}</div>`)).join('');
    if(tab==='tools')h=Object.entries(TOOLS).map(([id,t])=>p.tools.includes(id)?`<div class="sitem"><div class="ic">${t.i}</div><div class="nm">${t.n}</div><div class="sub2">${t.d}</div><div class="pr">✅ Owned</div></div>`:card(t.i,t.n,t.c,id,'tool',`<div class="sub2">${t.d}</div>`)).join('')+Object.entries(NQ.content.SUPPLIES).map(([id,s])=>card(s.i,s.packN,s.c,id,'supply',`<div class="sub2">${s.d} · You have ${(p.supplies||{})[id]||0}</div>`)).join('');
    if(tab==='habs')h=HAB_ORDER.filter(x=>!HABS[x].noBuy).map(hab=>p.habs.includes(hab)?`<div class="sitem"><div class="ic">${HABS[hab].i}</div><div class="nm">${HABS[hab].n}</div><div class="pr">✅ Yours</div></div>`:card(HABS[hab].i,HABS[hab].n,HABS[hab].c,hab,'hab',`<div class="sub2">${SPECIES.filter(s=>s.hab===hab&&!s.hidden).map(s=>petIcon(s)).join('')}</div>`)).join('');
    app.innerHTML=`${topBar('🛒 Shop','home')}<div class="tabs">${[['food','🍎 Food'],['pets','🐾 Pets'],['decor','🪴 Decor'],['tools','🧼 Care'],['habs','🏡 Habitats']].map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><div class="shop-grid">${h}</div>`;
    app.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;draw()}));
    app.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(...b.dataset.buy.split('|'))))}
  const NO_COINS='Not enough coins yet. Play a game to earn more! 🎵';
  function buy(kind,id){
    if(kind==='pet'){const s=SPM[id];const c=NQ.pets.canAdopt(id);if(c.reason==='full'){toast('That habitat is full!');return}if(c.reason==='coins'){toast('Not enough coins yet!');return}
      namePrompt(s.n,'Name your new '+s.n.toLowerCase(),name=>{const r=NQ.pets.adopt(id,name);if(!r.ok){toast(NO_COINS);return}sfxGood();go('home')});return}

    const cards=[['C3','bass'],['D3','bass'],['E3','bass'],['F3','bass'],['G3','bass'],['A3','bass'],['B3','bass'],['C4','bass'],['C4','treble'],['D4','treble'],['E4','treble'],['F4','treble'],['G4','treble'],['A4','treble'],['B4','treble'],['C5','treble']];
    for(let i=0;i<cards.length;i+=4){h+=`<div class="pg"><h1>🎴 Note Flashcards</h1><div class="sub">Cut along the outside, fold on the middle line. Note on one side, answer on the other.</div>`;
      cards.slice(i,i+4).forEach(([n,st])=>{h+=`<div class="card"><div class="f">${staffSVG({clef:st,s:15,width:230,clefX:8,topPad:40,botPad:40,notes:[{note:n,staff:st,x:150,type:'whole',letter:0}]})}</div><div class="b"><div class="L">${n[0]}</div><div class="s">${n==='C4'?'Middle C':''} ${st==='bass'?'Bass (left hand)':'Treble (right hand)'}</div>${miniKB(midiOf(n))}</div></div>`});
      h+=`<div class="foot">Note Quest</div></div>`}
  }
  if(kind==='sheets'){
    LEVELS.forEach(L=>{const items=levelItems(L);const qs=[];let prev=null;for(let i=0;i<12;i++){let it;do{it=items[Math.floor(Math.random()*items.length)]}while(prev&&it.note===prev.note&&it.staff===prev.staff&&items.length>1);prev=it;qs.push(it)}
      h+=`<div class="pg"><h1>${L.icon} ${L.name}: Name the Notes</h1><div class="sub">${L.desc}. Write the letter name in each box.</div><div class="name"><span>Name:</span><span>Date:</span><span style="flex:.6">Stars: ☆ ☆ ☆</span></div><div class="ws">`;
      qs.forEach(it=>{h+=`<div class="c">${staffSVG({clef:it.staff,s:11,width:170,clefX:6,topPad:30,botPad:28,notes:[{note:it.note,staff:it.staff,x:115,type:'whole',letter:0}]})}<div class="box"></div></div>`});
      h+=`</div><div class="key">Answers: ${qs.map((q,i)=>(i+1)+'. '+q.note[0]).join('   ')}</div><div class="foot">Note Quest</div></div>`});
    h+=`<div class="pg"><h1>🥁 Count the Beats</h1><div class="sub">Write how many beats each note gets. Then clap it!</div><div class="name"><span>Name:</span><span>Date:</span></div><div class="ws">`;
    [1,2,4,3,1,2,3,4,2,1,4,3].forEach(b=>{h+=`<div class="c">${noteValueSVG(b)}<div class="box"></div></div>`});h+=`</div><div class="foot">Note Quest</div></div>`;
  }
  if(kind==='songs'||kind==='songs-plain'){
    SONGS.forEach(song=>{const seq=song.seq;const meas=[];let cur=[],acc=0;seq.forEach((n,i)=>{cur.push(n);acc+=n.beats;if(acc>=song.ts){meas.push(cur);cur=[];acc=0}});
      h+=`<div class="pg"><h1>${song.icon} ${song.title}</h1><div class="sub">${song.pos}</div>`;const grand=song.staff==='grand';const s=grand?14:17,W=600,perSys=grand?Math.ceil(meas.length/2):Math.max(2,Math.ceil(meas.length/5));
      for(let si=0;si<meas.length;si+=perSys){const ms=meas.slice(si,si+perSys);const first=si===0;const startX=first?s*6.4:s*4.2;const mw=(W-startX-10)/perSys;const notes=[],bars=[];
        ms.forEach((mi,k)=>{const x0=startX+k*mw;let off=0;mi.forEach(n=>{const x=x0+s*1.4+(off/song.ts)*(mw-s*2.4);off+=n.beats;notes.push({note:n.note,staff:NQ.songs.staffFor(song,n.note),x,type:typeFor(n.beats),letter:kind==='songs'?1:0})});bars.push(x0+mw)});
        h+=`<div style="margin-bottom:${grand?24:14}px">${staffSVG({clef:song.staff,s,width:W,notes,bars:bars.slice(0,-1),final:si+perSys>=meas.length,ts:first?String(song.ts):null,topPad:s*2.4,botPad:s*2.2,gap:s*3.4})}</div>`}
      h+=`<div class="foot">Note Quest${kind==='songs'?' · with letter names':''}</div></div>`});
  }
  document.body.innerHTML=h;
};

/* ================= Boot ================= */
NQ.on('coins',e=>{const b=$('#coinBadge');if(b)b.textContent=e.total;if(!e.reward)return;const d=document.createElement('div');d.className='coinpop';d.textContent='+'+e.added+' 🪙';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)});
NQ.on('remote',onRemote);
NQ.on('savemode',refreshFoot);
NQ.start();
go('profiles');
</script>
</body>
</html>
