<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Note Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0b1030; --bg2:#1d1554; --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.14);
  --ink:#fff; --dim:#b9c0ff; --gold:#ffd23f; --teal:#3ee6c4; --pink:#ff6fae; --purple:#8b6cff; --red:#ff5d5d;
  --paper:#fffaf0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 20% 0%,#2a1f7a 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#0f4a6e 0%,transparent 50%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.15}}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:12px 14px 40px;min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;background:none}
h1,h2,h3{margin:0;font-weight:600}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:52px}
.top h1{font-size:26px;flex:1}
.back{width:52px;height:52px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:26px}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-size:18px;font-weight:600}
.me .av{font-size:26px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px 16px;text-align:center;transition:transform .12s;position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:56px;line-height:1.1}
.tile .nm{font-size:22px;font-weight:600}
.tile .sub{font-size:14px;color:var(--dim)}
.tile.locked{opacity:.45}
.tile .lock{position:absolute;top:10px;right:14px;font-size:22px}
.stars{color:var(--gold);font-size:20px;letter-spacing:2px}
.stars .off{color:rgba(255,255,255,.22)}
.big-title{text-align:center;margin:18px 0 6px}
.big-title .logo{font-size:64px}
.big-title h1{font-size:44px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.big-title p{color:var(--dim);font-size:20px;margin:4px 0 0}
.pcard .ic{font-size:70px}
.add .ic{font-size:50px;opacity:.8}
.hold{position:relative;overflow:hidden;margin:26px auto 0;display:block;padding:14px 26px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:16px;color:var(--dim)}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(62,230,196,.35);transition:width 0s}
.hold.on .fill{width:100%;transition:width 3s linear}
.hold span.t{position:relative}
.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:14px;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-size:20px;font-weight:600;background:linear-gradient(180deg,#ffe066,#ffc21a);color:#3a2600;box-shadow:0 5px 0 #c98f00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c98f00}
.btn.alt{background:linear-gradient(180deg,#7ff5dc,#2fd3b1);color:#033;box-shadow:0 5px 0 #16977d}
.btn.ghost{background:var(--card);color:#fff;box-shadow:none;border:2px solid var(--line)}
.btn.small{padding:9px 16px;font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.paper{background:var(--paper);border-radius:26px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);color:#222;position:relative}
.paper svg{display:block;margin:0 auto}
.drill-staff{max-width:640px;width:100%;margin:0 auto}
.prompt{text-align:center;font-size:24px;margin:14px 0 10px;font-weight:500}
.prog{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}
.prog i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
.prog i.done{background:var(--teal)}
.prog i.miss{background:var(--gold)}
.prog i.cur{background:#fff;transform:scale(1.25)}
.letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.lb{width:78px;height:78px;border-radius:50%;font-size:38px;font-weight:700;background:#fff;color:#222;border:6px solid var(--c,#ccc);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.lb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.lb.good{background:#c9ffe9;animation:pop .35s}
.lb.bad{background:#ffd0d0;animation:shake .35s}
.lb.reveal{box-shadow:0 0 0 6px var(--gold),0 5px 0 rgba(0,0,0,.35)}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.kb{position:relative;height:170px;width:100%;max-width:820px;margin:10px auto 0;touch-action:none}
.wk{position:absolute;top:0;bottom:0;background:linear-gradient(#fff,#f1f1f1);border:2px solid #333;border-radius:0 0 10px 10px;box-shadow:inset 0 -6px 0 #ddd}
.wk .mc{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--pink)}
.wk .kl{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-weight:700;color:#777;font-size:16px}
.bk{position:absolute;top:0;height:60%;background:linear-gradient(#333,#111);border-radius:0 0 7px 7px;z-index:2;box-shadow:inset 0 -5px 0 #000}
.wk.press{background:#e3f6ff}
.wk.good{background:#b9ffe0}
.wk.bad{background:#ffc7c7}
.wk.hint{background:#fff3b0;box-shadow:inset 0 -6px 0 var(--gold)}
.bk.press{background:#555}
.mic{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:17px}
.mic.on{background:rgba(255,111,174,.25);border-color:var(--pink)}
.mic .dot{width:12px;height:12px;border-radius:50%;background:#888}
.mic.on .dot{background:var(--pink);animation:tw 1s infinite}
.note-tip{text-align:center;color:var(--dim);font-size:15px;margin-top:6px}
/* result overlay */
.ov{position:fixed;inset:0;background:rgba(5,6,25,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.ovc{background:linear-gradient(180deg,#2c2290,#1a1560);border:3px solid var(--line);border-radius:30px;padding:26px 22px;text-align:center;max-width:440px;width:100%;animation:pop .4s}
.ovc h2{font-size:32px;margin-bottom:8px}
.ovc .bigstars{font-size:58px;letter-spacing:6px;color:var(--gold);margin:6px 0}
.ovc .bigstars .off{color:rgba(255,255,255,.2)}
.ovc p{font-size:19px;color:var(--dim);margin:8px 0 18px}
.stk-new{font-size:20px;margin:6px 0 16px}
.stk-new b{font-size:60px;display:block;animation:pop .6s}
.conf{position:fixed;top:-40px;font-size:28px;z-index:60;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150px);background:#fff;color:#222;padding:12px 20px;border-radius:16px;font-size:17px;z-index:70;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateX(-50%) translateY(0)}
.praise{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;color:#0c8f6a;pointer-events:none;animation:rise 1s forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110%)}}
/* meteor */
.arena{position:relative;height:calc(100vh - 290px);min-height:340px;border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3b2a8a 0%,transparent 60%),linear-gradient(#070a22,#151046);border:2px solid var(--line)}
.ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:radial-gradient(ellipse at 50% 0%,#8a6cff,#4b3ab0 70%);border-top:3px solid #b9a8ff}
.ground .base{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:34px}
.met{position:absolute;width:184px;transition:filter .2s}
.met .trail{position:absolute;left:50%;top:-56px;width:46px;height:70px;transform:translateX(-50%);background:linear-gradient(transparent,rgba(255,170,60,.55),rgba(255,90,40,.8));border-radius:50% 50% 40% 40%;filter:blur(3px)}
.met .rock{position:relative;background:var(--paper);border-radius:22px;border:4px solid #ffb347;padding:2px 4px;box-shadow:0 0 18px rgba(255,150,60,.55)}
.met.target .rock{border-color:var(--teal);box-shadow:0 0 0 4px rgba(62,230,196,.35),0 0 26px rgba(62,230,196,.8)}
.met.wrong .rock{animation:shake .35s}
.met.boom{pointer-events:none}
.met.boom .rock,.met.boom .trail{opacity:0;transform:scale(1.6);transition:all .35s}
.met .burst{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:70px;animation:pop .4s}
.hud{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:20px}
.hud .shields{font-size:26px;letter-spacing:4px}
.center-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:5}
.center-msg h2{font-size:34px}
.center-msg p{font-size:19px;color:var(--dim);margin:0;max-width:420px}
/* songs */
.song-wrap .paper{padding:10px 6px}
.song-ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.toggle{padding:10px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:17px}
.toggle.on{background:rgba(62,230,196,.25);border-color:var(--teal)}
/* rhythm */
.drum{width:190px;height:190px;border-radius:50%;margin:16px auto 0;display:flex;align-items:center;justify-content:center;font-size:84px;background:radial-gradient(circle at 40% 35%,#ff9ccc,#e03d87);box-shadow:0 10px 0 #9c1f59;touch-action:none}
.drum.hit{transform:translateY(6px);box-shadow:0 4px 0 #9c1f59}
.count{font-size:46px;text-align:center;height:56px;color:var(--gold);font-weight:700}
.playhead{position:absolute;top:8px;bottom:8px;width:4px;background:var(--pink);border-radius:2px;left:0;display:none}
.beats{display:flex;gap:14px;justify-content:center;margin-top:14px}
.beats .lb{width:84px;height:84px;font-size:40px}
/* stickers */
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.stk{aspect-ratio:1;border-radius:20px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:44px}
.stk.no{font-size:26px;color:rgba(255,255,255,.25)}
.sec-h{font-size:20px;margin:18px 0 10px;color:var(--dim)}
/* forms */
input.txt{font-family:inherit;font-size:26px;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:rgba(255,255,255,.95);color:#222;width:100%;max-width:420px;text-align:center;user-select:text;-webkit-user-select:text}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:520px;margin:18px auto}
.avb{font-size:44px;aspect-ratio:1;border-radius:20px;background:var(--card);border:3px solid transparent}
.avb.sel{border-color:var(--gold);background:rgba(255,210,63,.18)}
/* parent */
.pv{background:#f6f7fb;color:#1d2240;border-radius:24px;padding:18px;margin-bottom:14px}
.pv h3{font-size:19px;margin-bottom:10px}
.pv .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:#fff;border-radius:16px;padding:12px;border:1px solid #e3e6f0}
.kpi b{display:block;font-size:26px}
.kpi span{font-size:13px;color:#667}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:9px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:17px}
.tab.on{background:#fff;color:#1d2240}
.nrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #e7e9f2;font-size:15px}
.bar{height:14px;border-radius:7px;background:#e7e9f2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px}
.days{display:flex;gap:8px;align-items:flex-end;height:110px;padding-top:6px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:#667}
.days div i{display:block;width:70%;background:#8b6cff;border-radius:6px 6px 2px 2px;min-height:2px}
.seg{display:inline-flex;border:2px solid #d5d9e8;border-radius:999px;overflow:hidden}
.seg button{padding:8px 14px;font-size:15px;color:#1d2240}
.seg button.on{background:#1d2240;color:#fff}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e7e9f2;font-size:16px;flex-wrap:wrap}
.pbtn{padding:8px 14px;border-radius:12px;border:2px solid #d5d9e8;font-size:15px;color:#1d2240;background:#fff}
.pbtn.danger{border-color:#ffb3b3;color:#c02525}
.miss-list span{display:inline-block;background:#ffe3ec;color:#a3164a;padding:6px 12px;border-radius:999px;margin:3px;font-size:15px}
.meet-name{text-align:center;font-size:54px;font-weight:700;height:70px;color:var(--gold)}
.holdbtn{width:200px;height:200px;border-radius:50%;margin:8px auto 0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;letter-spacing:2px;background:radial-gradient(circle at 40% 35%,#ff9ccc,#e03d87);box-shadow:0 10px 0 #9c1f59;touch-action:none;color:#fff}
.holdbtn.down{transform:translateY(6px);box-shadow:0 4px 0 #157a65,0 0 0 10px rgba(62,230,196,.25);background:radial-gradient(circle at 40% 35%,#a5f9e8,#2fd3b1)}
.scene{position:relative;height:250px;border-radius:26px;overflow:hidden;background:linear-gradient(#ffb3d9 0%,#c39bff 45%,#6a55d6 100%);border:2px solid var(--line);margin-bottom:12px}
.scene .sun{position:absolute;right:16px;top:8px;font-size:44px;opacity:.85}
.rainbow{position:absolute;left:0;right:0;bottom:0;height:54px;background:linear-gradient(#ff5d5d 0 9px,#ff9f40 9px 18px,#ffd23f 18px 27px,#4cd964 27px 36px,#4aa3ff 36px 45px,#a77bff 45px 54px)}
.uni,.hero,.cloud{position:absolute;bottom:46px;transform:translateX(-50%);font-size:66px;line-height:1}
.cloud{bottom:128px;font-size:70px;transition:opacity .8s}
.cloud .wind{position:absolute;left:-34px;top:20px;font-size:34px;transform:scaleX(-1);opacity:.8}
.cloud.gust .b2{display:inline-block;animation:shake .4s}
.cloud.poof{opacity:0}
.uni .b,.hero .b{display:inline-block;animation:gallop .45s infinite alternate ease-in-out}
.uni .flip{display:inline-block;transform:scaleX(-1)}
.hero.jump .b{animation:hop .4s}
.uni.away{transition:left 1s,opacity 1s;left:110%!important;opacity:0}
@keyframes gallop{to{transform:translateY(-8px) rotate(-4deg)}}
@keyframes hop{50%{transform:translateY(-34px)}}
.hearts{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:54px;animation:pop .6s}
.uni-staff{max-width:460px;width:100%;margin:0 auto}
.mode-tog{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.mode-tog button{padding:10px 16px;font-size:17px}
.mode-tog button.on{background:#fff;color:#1d2240}
.mictest{font-size:64px;font-weight:700;text-align:center;color:#1d2240;height:80px}
.me .cn{margin-left:4px;color:var(--gold)}
.habtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.htab{font-size:17px;padding:8px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.htab.on{background:#fff;color:#1d2240}
.htab.lockd{opacity:.55}
.hab{position:relative;height:52vh;min-height:330px;border-radius:26px;overflow:hidden;border:3px solid rgba(255,255,255,.3);box-shadow:inset 0 0 50px rgba(0,0,0,.18)}
.pet{position:absolute;transform:translate(-50%,-100%);transition:left 2.4s ease-in-out,top 2.4s ease-in-out;text-align:center;z-index:3;cursor:pointer}
.pet .pi{font-size:60px;line-height:1;display:block;transition:transform .3s}
.pet .pn{font-size:13px;font-weight:600;color:#1d2240;background:rgba(255,255,255,.85);border-radius:8px;padding:0 6px;display:table;margin:-4px auto 0;white-space:nowrap}
.pet.sleepy .pi{filter:grayscale(.55) brightness(.85)}
.pet .zz{position:absolute;right:-12px;top:-8px;font-size:22px}
.pet .bub{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:2px 8px;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.2);animation:bob 1.6s infinite ease-in-out}
.mess{position:absolute;font-size:36px;transform:translate(-50%,-50%);z-index:2;cursor:pointer;animation:wig 2.4s infinite;transition:opacity .25s,transform .25s}
.mess.gone{opacity:0;transform:translate(-50%,-90%) scale(1.5)}
.deco{position:absolute;font-size:48px;line-height:1;transform:translate(-50%,-100%);z-index:1;touch-action:none}
.decomode .deco{outline:2px dashed rgba(255,255,255,.9);border-radius:10px;cursor:grab;z-index:4}
.decomode .pet,.decomode .mess{pointer-events:none;opacity:.6}
.tray-h{font-size:15px;color:var(--dim);margin:10px 0 6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.tray{display:flex;gap:8px;overflow-x:auto;padding:10px;background:var(--card);border-radius:18px}
.tray button{font-size:36px;min-width:66px;height:70px;border-radius:14px;background:rgba(255,255,255,.12);position:relative;flex:none}
.tray button small{position:absolute;left:0;right:0;bottom:1px;font-size:11px;color:#fff}
.hab-actions{margin-top:14px}
.btn.play{font-size:26px;padding:16px 42px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sitem{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.sitem .ic{font-size:48px;line-height:1.2}
.sitem .nm{font-weight:600;font-size:17px}
.sitem .pr{color:var(--gold);font-weight:700;margin:2px 0 4px}
.sitem.dis{opacity:.55}
.sub2{font-size:13px;color:var(--dim)}
.ovc.sheet{max-height:92vh;overflow:auto}
.sheet .big{font-size:92px;line-height:1.1;position:relative}
.mini{font-size:20px;vertical-align:middle}
.nb{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:8px 0;text-align:left;font-size:16px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.acts button{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 4px;font-size:15px;line-height:1.4}
.acts button.need{opacity:.5}
.foods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.foods button{font-size:30px;background:#fff;color:#222;border-radius:14px;padding:6px 10px;position:relative}
.foods button:disabled{opacity:.4}
.foods button small{font-size:13px}
.foods .fav{position:absolute;top:-8px;right:-6px;font-size:14px}
.coinpop{position:fixed;right:24px;top:58px;font-weight:700;color:var(--gold);font-size:22px;z-index:80;animation:rise2 1s forwards;pointer-events:none}
@keyframes rise2{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes wig{50%{transform:translate(-50%,-50%) rotate(7deg)}}
textarea.code{width:100%;height:110px;margin-top:10px;font-family:monospace;font-size:12px;border-radius:12px;border:2px solid #d5d9e8;padding:8px;user-select:text;-webkit-user-select:text}
.rigicon{display:inline-block;width:1.6em;height:1.35em;vertical-align:middle}
.rigicon .rigsvg{width:100%;height:100%}

<script id="nq-engine">
/* ===== ENGINE ZONE (Claude) =====
   Note Quest engine: rules, data, saving and the microphone.
   It never draws and never touches the page layout. Screens talk to it only through window.NQ.
   Contract: coordination/ENGINE_API.md */
(function(){
'use strict';
const VERSION='1.5.2';

/* ---------- Events ---------- */
const listeners={};

/* ---------- Music basics ---------- */
const LETTERS=['C','D','E','F','G','A','B'];

const NOTE_NAMES=['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'];
const midiOf=n=>(+n.slice(1)+1)*12+SEMI[n[0]];

const niceName=n=>n==='C4'?'Middle C':n[0];
const nameFromMidi=m=>NOTE_NAMES[m%12]+(Math.floor(m/12)-1);
const noteKey=(note,staff)=>note+(staff==='bass'?'b':'t');

/* ---------- Music theory: spelling by letter (pure, no save) ----------
   Notes are written 'C', 'F#', 'Bb', 'C##', 'Ebb', with an optional octave ('F#4', 'B#3').
   The octave belongs to the letter (scientific pitch): B#3 sounds as C4, Cb4 as B3.
   Intervals are short names: 'P1' 'm2' 'M2' 'm3' 'M3' 'P4' 'A4' 'd5' 'P5' 'm6' 'M6' 'm7' 'M7' 'P8', up to 'P15'.
   Bad input returns null; nothing here throws or touches the save. */
const THEORY=(()=>{
  const mod=(n,m)=>((n%m)+m)%m;
  const ACC={'#':1,'♯':1,'x':2,'𝄪':2,'b':-1,'♭':-1,'𝄫':-2};
  const SUFFIX={'-2':'bb','-1':'b','0':'','1':'#','2':'##'};
  function parse(name){if(typeof name!=='string')return null;const m=name.trim().match(/^([A-Ga-g])((?:#|♯|x|𝄪|b|♭|𝄫)*)(-?\d+)?$/u);if(!m)return null;
    let acc=0;for(const ch of m[2])acc+=ACC[ch];if(acc<-2||acc>2)return null;
    return {letter:m[1].toUpperCase(),acc,octave:m[3]===undefined?null:+m[3]}}
  const build=(letter,acc,octave)=>SUFFIX[acc]===undefined?null:letter+SUFFIX[acc]+(octave==null?'':octave);
  function norm(name){const n=parse(name);return n?build(n.letter,n.acc,n.octave):null}
  function pc(name){const n=parse(name);return n?mod(SEMI[n.letter]+n.acc,12):null}
  function midi(name){const n=parse(name);return n&&n.octave!=null?(n.octave+1)*12+SEMI[n.letter]+n.acc:null}
  const dia=n=>(n.octave||0)*7+LETTERS.indexOf(n.letter);
  function fmt(name){return typeof name!=='string'?'':name.replace(/(^|[A-G])##/g,'$1𝄪').replace(/(^|[A-G])bb/g,'$1𝄫').replace(/(^|[A-G])#/g,'$1♯').replace(/([A-G])b/g,'$1♭')}

  /* intervals */
  const BASE=[0,2,4,5,7,9,11];const PERFECT=[1,4,5];
  const ORD={1:'unison',2:'2nd',3:'3rd',4:'4th',5:'5th',6:'6th',7:'7th',8:'octave',9:'9th',10:'10th',11:'11th',12:'12th',13:'13th',14:'14th',15:'double octave'};

  function qualityOf(number,diff){const s=mod(number-1,7)+1;if(PERFECT.includes(s))return ({'-2':'dd','-1':'d','0':'P','1':'A','2':'AA'})[diff]||null;
    return ({'-3':'dd','-2':'d','-1':'m','0':'M','1':'A','2':'AA'})[diff]||null}
  function parseIvl(s){const m=typeof s==='string'&&s.match(/^(dd|AA|P|M|m|A|d)(\d{1,2})$/);if(!m)return null;const number=+m[2];if(number<1||number>15)return null;

    const diff=perfect?({dd:-2,d:-1,P:0,A:1,AA:2})[q]:({dd:-3,d:-2,m:-1,M:0,A:1,AA:2})[q];

    return {quality:q,number,simple,semitones}}

    name:(QWORD[q]||q)+' '+ORD[number],compound:number>8}}
  /* interval(a, b): from a to b. With octaves on both, the real distance and direction.
     Without octaves, b is taken as the nearest copy above a (within an octave). */
  function interval(a,b){const A=parse(a),B=parse(b);if(!A||!B)return null;
    if(A.octave!=null&&B.octave!=null){let lo=A,hi=B,direction='up';const d=dia(B)-dia(A);
      const sem=midi(b)-midi(a);

      const number=Math.abs(d)+1;if(number>15)return null;const s=Math.abs(sem);

    const number=mod(LETTERS.indexOf(B.letter)-LETTERS.indexOf(A.letter),7)+1;const base=BASE[number-1];

  function intervalNumber(a,b){const A=parse(a),B=parse(b);if(!A||!B)return null;
    if(A.octave!=null&&B.octave!=null)return Math.abs(dia(B)-dia(A))+1;return mod(LETTERS.indexOf(B.letter)-LETTERS.indexOf(A.letter),7)+1}

  function transpose(note,ivl,dir='up'){const N=parse(note),I=parseIvl(ivl);if(!N||!I)return null;const sign=dir==='down'?-1:1;
    const di=LETTERS.indexOf(N.letter)+sign*(I.number-1);const letter=LETTERS[mod(di,7)];
    const octShift=Math.floor(di/7);const target=SEMI[N.letter]+N.acc+sign*I.semitones;
    const natural=SEMI[letter]+12*octShift;const acc=target-natural;if(acc<-2||acc>2)return null;
    return build(letter,acc,N.octave==null?null:N.octave+octShift)}

  /* scales and chords */
  const SCALES={major:['P1','M2','M3','P4','P5','M6','M7'],natural:['P1','M2','m3','P4','P5','m6','m7'],harmonic:['P1','M2','m3','P4','P5','m6','M7'],melodic:['P1','M2','m3','P4','P5','M6','M7'],
    majorPentatonic:['P1','M2','M3','P5','M6'],fiveFinger:['P1','M2','M3','P4','P5'],minorFiveFinger:['P1','M2','m3','P4','P5']};
  SCALES.minor=SCALES.natural;
  function scale(tonic,kind='major'){const iv=SCALES[kind];if(!iv||!parse(tonic))return null;const out=iv.map(x=>transpose(tonic,x));return out.every(Boolean)?out:null}
  const CHORDS={major:{iv:['P1','M3','P5'],symbol:''},minor:{iv:['P1','m3','P5'],symbol:'m'},diminished:{iv:['P1','m3','d5'],symbol:'dim'},augmented:{iv:['P1','M3','A5'],symbol:'aug'},
    dominant7:{iv:['P1','M3','P5','m7'],symbol:'7'},major7:{iv:['P1','M3','P5','M7'],symbol:'maj7'},minor7:{iv:['P1','m3','P5','m7'],symbol:'m7'},
    halfDiminished7:{iv:['P1','m3','d5','m7'],symbol:'m7♭5'},diminished7:{iv:['P1','m3','d5','d7'],symbol:'dim7'},
    minorMajor7:{iv:['P1','m3','P5','M7'],symbol:'m(maj7)'},augmentedMajor7:{iv:['P1','M3','A5','M7'],symbol:'aug(maj7)'},sus2:{iv:['P1','M2','P5'],symbol:'sus2'},sus4:{iv:['P1','P4','P5'],symbol:'sus4'}};
  /* chord('C4','major', inversion) → ['C4','E4','G4']; inversion moves the lowest notes up an octave */
  function chord(root,kind='major',inversion=0){const c=CHORDS[kind];if(!c||!parse(root))return null;let notes=c.iv.map(x=>transpose(root,x));if(!notes.every(Boolean))return null;
    inversion=inversion|0;if(inversion<0||inversion>=notes.length)return null;
    for(let i=0;i<inversion;i++){const n=notes.shift();notes.push(parse(n).octave==null?n:transpose(n,'P8'))}return notes}
  /* identifyChord(notes): the first note is taken as the bass. Spelling decides (C–E–G♯ is augmented, C–E–A♭ is not a triad). */
  function identifyChord(notes){if(!Array.isArray(notes)||notes.length<2)return null;const P_=notes.map(parse);if(P_.some(x=>!x))return null;
    const plain=P_.map(x=>build(x.letter,x.acc,null));const uniq=[...new Set(plain)];
    for(const root of uniq){const ivs=uniq.map(n=>interval(root,n)).map(x=>x&&x.short).filter(Boolean).map(s=>s==='P8'?'P1':s);
      for(const [kind,c] of Object.entries(CHORDS)){if(c.iv.length===ivs.length&&c.iv.every(x=>ivs.includes(x))){
        const order=c.iv.map(x=>transpose(root,x));const inversion=order.indexOf(plain[0]);
        return {root,kind,symbol:fmt(root)+c.symbol,inversion,bass:plain[0],tones:order}}}}
    return null}

  /* keys */
  const SHARP_ORDER=['F#','C#','G#','D#','A#','E#','B#'],FLAT_ORDER=['Bb','Eb','Ab','Db','Gb','Cb','Fb'];
  const MAJOR_KEYS=['Cb','Gb','Db','Ab','Eb','Bb','F','C','G','D','A','E','B','F#','C#'];
  const MINOR_KEYS=['Ab','Eb','Bb','F','C','G','D','A','E','B','F#','C#','G#','D#','A#'];
  function relative(tonic,mode='major'){const n=norm(tonic);if(!n)return null;const plain=n.replace(/-?\d+$/,'');return mode==='minor'?transpose(plain,'m3','up'):transpose(plain,'m3','down')}

  function keySignature(tonic,mode='major'){const n=norm(tonic);if(!n||!['major','minor'].includes(mode))return null;const plain=n.replace(/-?\d+$/,'');

    const sharps=SHARP_ORDER.filter(x=>sc.includes(x)),flats=FLAT_ORDER.filter(x=>sc.includes(x));if(sharps.length&&flats.length)return null;

  async flush(){if(!this.ref)return;if(this.writing){this.dirty=true;return}this.writing=true;
    try{await this.ref.set({json:JSON.stringify(S),updated:S.updated})}catch(e){const c=e&&e.code;if(c==='unavailable'){setTimeout(()=>this.flush(),1500+Math.random()*2000)}else{this.ref=null;this.mode='device';emit('savemode',this.mode)}}
    this.writing=false;if(this.dirty){this.dirty=false;this.flush()}},
  async connect(){try{if(!(window.claude&&typeof window.claude.use==='function'))return;
      const db=await window.claude.use('db');const user=await window.claude.use('user');if(!db||!user)return;
      const id=await user.id();if(!id)return;const ref=db.doc('data/users/'+id+'/notequest');

      if(snap.exists){const d=snap.data();remoteUpdated=d.updated||0;let remote=null;try{remote=JSON.parse(d.json)}catch(e){}
        if(remote&&Array.isArray(remote.profiles)&&remoteUpdated>(S.updated||0)){dropRounds(null);S=migrate(remote);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(curId&&!P())curId=null;emit('remote')}}

function stat(k){const p=P();return p.notes[k]||(p.notes[k]={r:0,w:0,streak:0})}
function record(k,ok){const st=stat(k);if(ok){st.r++;st.streak++;addCoins(1)}else{st.w++;st.streak=Math.max(0,st.streak-2);save()}}

  if(roundId!=null){const sr=startedRounds[roundId];if(!sr)return {sticker:null,coins:roundCoins,best:false,duplicate:true,counted:false};if(!P()||sr.pid!==P().id)return {sticker:null,coins:roundCoins,best:false,duplicate:false,counted:false,reason:'wrong-profile'};delete startedRounds[roundId]}

  pet.bath={id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),startedAt:Date.now()};save();const d=announce(pet);return {ok:true,bathId:pet.bath.id,display:d}}
function finishBath(x,bathId){const pet=own(x);if(!pet)return NOT_OWNED;if(!pet.bath||pet.bath.id!==bathId||staleBath(pet)){if(staleBath(pet)){delete pet.bath;save()}return {ok:false,reason:'no-bath'}}
  const p=petInit();if(!(p.supplies.soap>0)){delete pet.bath;save();announce(pet);return {ok:false,reason:'no-soap'}}
  p.supplies.soap--;delete pet.bath;setNeed(pet,'c',100);pet.excitedUntil=Date.now()+EXCITE_MS;updateSick(pet);save();const d=announce(pet);return {ok:true,display:d,soapLeft:p.supplies.soap}}
function cancelBath(x){const pet=own(x);if(!pet)return NOT_OWNED;if(!pet.bath)return {ok:false,reason:'no-bath'};delete pet.bath;save();announce(pet);return {ok:true}}
/* deprecated one-step bath: same checks, same soap */
function clean(x){const s=startBath(x);if(!s.ok)return s;return finishBath(x,s.bathId)}

/* ----- primary pet and sidekick ----- */
function companions(){const p=P();if(!p)return {primary:null,sidekick:null};petInit(p);const c=p.companions;return {primary:own(c.primary||'',p),sidekick:own(c.sidekick||'',p)}}
function setPrimary(id){const p=P();if(!p)return {ok:false,reason:'no-profile'};petInit(p);if(!own(id,p))return NOT_OWNED;const c=p.companions;if(c.sidekick===id)c.sidekick=c.primary||null;c.primary=id;save();emit('companions:changed',companions());return {ok:true}}
function setSidekick(id){const p=P();if(!p)return {ok:false,reason:'no-profile'};petInit(p);const c=p.companions;if(id==null){c.sidekick=null;save();emit('companions:changed',companions());return {ok:true}}
  if(!own(id,p))return NOT_OWNED;if(c.primary===id)c.primary=c.sidekick||null;c.sidekick=id;save();emit('companions:changed',companions());return {ok:true}}
/* HH:mm, 00:00–23:59. Equal start and end means no night hours (pets only nap). Invalid input changes nothing. */
function setNight(start,end){const p=P();if(!p)return false;const ok=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s));return !!m&&+m[1]<=23&&+m[2]<=59};if(!ok(start)||!ok(end))return false;petInit(p).petPrefs={nightStart:start,nightEnd:end};save();return true}

/* ----- save upgrade v1 → v2 (idempotent, never deletes) ----- */
function migrate(o){if(!o||!Array.isArray(o.profiles))return o;o.settings=o.settings||{sound:true};
  o.profiles.forEach(p=>{if(!p.pets&&!p.coins&&!p.starterDone){return}petInit(p);
    Object.values(p.mess||{}).forEach(list=>list.forEach(m=>{if(!m.type)m.type=ICON_TYPE[m.i]||'leaves'}));
    p.pets.forEach(pet=>{if(pet.bath)delete pet.bath})});
  o.v=Math.max(2,o.v||1);return o}
function setHabitat(hab){const p=petInit();if(!p.habs.includes(hab))return false;p.curHab=hab;save();return true}
function currentHabitat(){const p=petInit();const hab=p.habs.includes(p.curHab)?p.curHab:p.habs[0];p.curHab=hab;return hab}
function price(kind,id){return kind==='food'?FOODS[id]&&FOODS[id].c:kind==='decor'?(DECOR.find(x=>x[0]===id)||[])[2]:kind==='tool'?TOOLS[id]&&TOOLS[id].c:kind==='hab'?HABS[id]&&HABS[id].c:kind==='pet'?SPM[id]&&SPM[id].c:kind==='supply'?SUPPLIES[id]&&SUPPLIES[id].c:undefined}
function buy(kind,id){const p=petInit();
  if(kind==='pet')return {ok:false,reason:'use-adopt'};
  if(kind==='tool'&&p.tools.includes(id))return {ok:false,reason:'owned'};
  if(kind==='hab'&&(p.habs.includes(id)||!HABS[id]||HABS[id].noBuy))return {ok:false,reason:'owned'};
  const c=price(kind,id);if(c==null)return {ok:false,reason:'unknown'};if(!spend(c))return {ok:false,reason:'coins',need:c-p.coins};
  if(kind==='food')p.inv[id]=(p.inv[id]||0)+1;
  if(kind==='supply')p.supplies[id]=(p.supplies[id]||0)+SUPPLIES[id].qty;
  if(kind==='decor')p.decorInv[id]=(p.decorInv[id]||0)+1;
  if(kind==='tool')p.tools.push(id);
  if(kind==='hab'){p.habs.push(id);p.curHab=id}
  save();return {ok:true}}
function placeDecor(i,src,hab){const p=petInit();if(src==='shop'){if(!(p.decorInv[i]>0))return null;p.decorInv[i]--}else if(src==='sticker'){if(!p.stickers.includes(i)||p.decor.some(d=>d.src==='sticker'&&d.i===i))return null}else return null;
  const d={id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),i,hab,x:30+Math.random()*40,y:62+Math.random()*20,src};p.decor.push(d);save();return d}
function moveDecor(id,x,y){const it=P().decor.find(z=>z.id===id);if(!it)return false;it.x=x;it.y=y;save();return true}
function removeDecor(id){const p=P();const it=p.decor.find(z=>z.id===id);if(!it)return false;p.decor=p.decor.filter(z=>z!==it);if(it.src==='shop')p.decorInv[it.i]=(p.decorInv[it.i]||0)+1;save();return true}
function decorTray(){const p=petInit();const placed=new Set(p.decor.filter(d=>d.src==='sticker').map(d=>d.i));return {shop:Object.entries(p.decorInv).filter(([,n])=>n>0).map(([i,n])=>({i,n})),stickers:p.stickers.filter(s=>!placed.has(s))}}
function decorOwned(i){const p=petInit();return (p.decorInv[i]||0)+p.decor.filter(d=>d.i===i&&d.src==='shop').length}

/* ---------- Rescue missions ---------- */
function wildInit(p=P()){const had=p.wild&&p.wild.given&&p.wild.invite&&p.wild.journal;p.wild=p.wild||{};const w=p.wild;w.sup=w.sup||{};w.mis=w.mis||{};w.done=w.done||{};w.journal=w.journal||{};w.given=w.given||{};w.invite=w.invite||{};if(!had)save();return w}
function mission(a,p=P()){const w=wildInit(p);const ms=WILD[a].m;return ms[(w.mis[a]||0)%ms.length]}
/* Items still to give for the current mission (need minus what was already given), as a list with repeats. */
function remaining(a,p=P()){const w=wildInit(p);const given=(w.given[a]||[]).slice();return mission(a,p).need.filter(id=>{const i=given.indexOf(id);if(i>=0){given.splice(i,1);return false}return true})}
function missing(a,p=P()){const w=wildInit(p);const used={};return remaining(a,p).filter(id=>{used[id]=(used[id]||0)+1;return (w.sup[id]||0)<used[id]})}
function needStatus(a){const w=wildInit();const given=(w.given[a]||[]).slice();const used={};return mission(a).need.map(id=>{const gi=given.indexOf(id);if(gi>=0){given.splice(gi,1);return {id,have:true,given:true}}used[id]=(used[id]||0)+1;return {id,have:(w.sup[id]||0)>=used[id],given:false}})}
function awardChest(a,stars){const w=wildInit();const miss=missing(a);const got=miss[0]||mission(a).need[0];w.sup[got]=(w.sup[got]||0)+1;let bonus=null;
  if(stars===3){const ids=Object.keys(SUP);bonus=ids[Math.floor(Math.random()*ids.length)];w.sup[bonus]=(w.sup[bonus]||0)+1}save();return {got,bonus,ready:!missing(a).length}}
const isWild=a=>Object.prototype.hasOwnProperty.call(WILD,a);
/* Completing a mission happens only here: when every needed item has been given. */
function completeRescue(a){const w=wildInit();w.mis[a]=(w.mis[a]||0)+1;w.done[a]=(w.done[a]||0)+1;delete w.given[a];
  const j=w.journal[a]||(w.journal[a]={n:0,first:Date.now()});j.n++;w.invite[a]=(w.invite[a]||0)+1;addCoins(5);save();return {ok:true,done:true,left:[],fact:WILD[a].fact}}
/* Give one needed item to an animal. Checks the item is still needed and held, uses it up, and finishes the rescue when nothing is left. */
function giveSupply(a,id){if(!isWild(a))return {ok:false,reason:'unknown'};const w=wildInit();const left=remaining(a);
  if(!left.includes(id))return {ok:false,reason:'not-needed',left};if(!(w.sup[id]>0))return {ok:false,reason:'not-held',left};
  w.sup[id]--;(w.given[a]=w.given[a]||[]).push(id);const now=remaining(a);if(!now.length)return completeRescue(a);save();return {ok:true,done:false,left:now}}
/* One-shot rescue: only succeeds when every remaining item is held; uses them all up at once. */
function rescue(a){if(!isWild(a))return {ok:false,reason:'unknown'};const miss=missing(a);if(miss.length)return {ok:false,reason:'missing',missing:miss};
  const w=wildInit();remaining(a).forEach(id=>{w.sup[id]--;(w.given[a]=w.given[a]||[]).push(id)});return completeRescue(a)}
/* Inviting needs a finished rescue that hasn't been used for an invite or a release yet. */
function invite(a,name){const p=petInit();const w=wildInit(p);if(!isWild(a))return {ok:false,reason:'unknown'};if(!(w.invite[a]>0))return {ok:false,reason:'not-rescued'};
  if(petsIn('sanct').length>=MAX_PETS)return {ok:false,reason:'full'};name=String(name||'').trim()||WILD[a].n;
  w.invite[a]--;if(!w.invite[a])delete w.invite[a];if(!p.habs.includes('sanct'))p.habs.push('sanct');const pet=newPet(a,name,'sanct');pet.excitedUntil=Date.now()+EXCITE_MS;p.pets.push(pet);p.curHab='sanct';if(!p.companions.primary)p.companions.primary=pet.id;save();return {ok:true,pet}}
function release(a){const w=wildInit();if(!(w.invite[a]>0))return {ok:false,reason:'not-rescued'};w.invite[a]--;if(!w.invite[a])delete w.invite[a];save();return {ok:true}}
function setExplorer(look){wildInit().explorer=Object.assign({},look);save()}

const LSTATES=['not-introduced','exploring','developing','secure','transferable'];
const REVIEW_DAYS=[1,3,7,21,60];
const ROUND_DEFAULTS={self:1,caregiver:1,song:1,rhythmTap:3};
const SKILL=Object.fromEntries(CURRICULUM.skills.map(s=>[s.id,s]));
const STOP=Object.fromEntries(CURRICULUM.stops.map(s=>[s.id,s]));
CURRICULUM.stops.forEach(st=>st.skills.forEach(id=>{if(SKILL[id]){SKILL[id].stop=st.id;SKILL[id].level=st.level}}));
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const rank=s=>LSTATES.indexOf(s);

function learnInit(p=P()){const had=p.learn&&p.learn.skills&&p.learn.learned;p.learn=p.learn||{};const L=p.learn;L.skills=L.skills||{};L.learned=L.learned||{};L.placedAt=L.placedAt||null;if(!had)save();return L}
function learnerOpt(p=P()){return Object.assign({presentation:'child',reads:true},p.learner||{})}
function skillRec(id,p=P()){const L=learnInit(p);if(!L.skills[id]){L.skills[id]={state:'not-introduced',passDays:[],history:[],reviewIdx:-1,nextReview:null,placed:false};save()}return L.skills[id]}
function skillState(id){return (learnInit().skills[id]||{}).state||'not-introduced'}
function prereqsMet(id){return (SKILL[id].prereqs||[]).every(q=>rank(skillState(q))>=rank('developing'))}
function missingPrereqs(id){return (SKILL[id].prereqs||[]).filter(q=>rank(skillState(q))<rank('developing'))}
function stopComplete(id){return STOP[id].skills.every(s=>rank(skillState(s))>=rank('secure'))}
function stopUnlocked(id){const i=CURRICULUM.stops.findIndex(s=>s.id===id);if(i<=0)return true;return stopComplete(CURRICULUM.stops[i-1].id)||STOP[id].skills.some(s=>rank(skillState(s))>rank('not-introduced'))}
function stopStatus(id){const st=STOP[id];if(!st)return null;const L=learnInit();const skills=st.skills.map(s=>({id:s,state:skillState(s)}));

  if(ev.type==='notes'){if(h.onNotes)h.onNotes(ev);if(h.onNote)h.onNote(ev.top);

const TREBLE_PATH='M14,33 C9,33 8,27 12,25 C17,22 23,27 20,34 C17,41 5,40 4,31 C3,22 15,15 18,6 C20,-2 18,-11 14,-12 C10,-13 9,-4 10,4 L15,47 C16,53 10,56 7,52';

/* o: {clef, s, width, notes:[{note,staff,x,type,color,letter:opacity,glow,i}], clefX, ts, bars:[x], final, topPad, botPad, gap, lineStart} */
function staffSVG(o){

  }
  if(staves.length===2){const yA=staves[0].y,yB=staves[1].y+4*s;
    g+=`<line x1="${x0}" x2="${x0}" y1="${yA}" y2="${yB}" stroke="#333" stroke-width="${sw*1.3}"/>`;

  for(const bx of (o.bars||[])){const yA=staves[0].y,yB=staves[staves.length-1].y+4*s;g+=`<line x1="${bx}" x2="${bx}" y1="${yA}" y2="${yB}" stroke="#333" stroke-width="${sw}"/>`;}
  if(o.final){const yA=staves[0].y,yB=staves[staves.length-1].y+4*s;g+=`<line x1="${x1-s*.5}" x2="${x1-s*.5}" y1="${yA}" y2="${yB}" stroke="#333" stroke-width="${sw}"/><line x1="${x1-s*.15}" x2="${x1-s*.15}" y1="${yA}" y2="${yB}" stroke="#333" stroke-width="${sw*3}"/>`;}

/* rhythm line: measures = [[beats...],...] */
function rhythmSVG(measures,bpm,opt={}){

    let off=0;ms.forEach(b=>{const x=beatX(mi*bpm+off);const t=typeFor(b);const idx=xs.length;xs.push(x);const col=(opt.colors&&opt.colors[idx])||'#222';
      const filled=t==='quarter';

      g+=`<ellipse cx="${x}" cy="${ly}" rx="${t==='whole'?12:10}" ry="${t==='whole'?8.5:7.5}" transform="rotate(-20 ${x} ${ly})" fill="${filled?col:'#fff'}" stroke="${col}" stroke-width="2.6"/>`;
      if(t==='dhalf') g+=`<circle cx="${x+18}" cy="${ly-5}" r="2.6" fill="${col}"/>`;
      if(opt.counts!==false){const lab=[];for(let k=0;k<b;k++)lab.push(off+k+1);g+=`<text x="${x}" y="${ly+50}" font-size="17" text-anchor="start" fill="#6a5acd" font-weight="600">${lab.join(' ')}</text>`;}
      if(opt.marks&&opt.marks[idx]) g+=`<text x="${x}" y="${ly-54}" font-size="22" text-anchor="middle">${opt.marks[idx]}</text>`;
      off+=b;});
  });
  return {svg:g+'</svg>',xs,beatX,W};
}
function noteValueSVG(b){
  const t=typeFor(b);const filled=t==='quarter';
  return `<svg viewBox="0 0 120 140" width="130" height="150"><line x1="10" x2="110" y1="100" y2="100" stroke="#ccc" stroke-width="2"/>${t!=='whole'?`<line x1="71" x2="71" y1="100" y2="22" stroke="#222" stroke-width="5"/>`:''}<ellipse cx="55" cy="100" rx="${t==='whole'?24:19}" ry="${t==='whole'?16:14}" transform="rotate(-20 55 100)" fill="${filled?'#222':'#fff'}" stroke="#222" stroke-width="5"/>${t==='dhalf'?'<circle cx="92" cy="92" r="5" fill="#222"/>':''}</svg>`;
}

/* ================= Audio ================= */
function playMidi(m,dur=1.1,when=0,vol=.32){const a=ac();if(!a||!soundOn())return;const t=a.currentTime+when+.01;const f=440*Math.pow(2,(m-69)/12);
  const out=a.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(vol,t+.008);out.gain.exponentialRampToValueAtTime(vol*.35,t+.25);out.gain.exponentialRampToValueAtTime(.0005,t+dur);

}

function sfxBad(){const a=ac();if(!a||!soundOn())return;const t=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(110,t+.22);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.3)}
let NOISE=null;function noiseBuf(a){if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate*.05,a.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}return NOISE}
function clickAt(t,accent,soft){const a=ac();if(!a||!soundOn())return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(accent?1750:1250,t);o.frequency.exponentialRampToValueAtTime(accent?1000:700,t+.05);

let holdNode=null;
function holdStart(){holdStop();const a=ac();if(!a||!soundOn())return;const t=a.currentTime;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.012);g.connect(a.destination);
  const o=a.createOscillator();o.type='triangle';o.frequency.value=523.25;o.connect(g);const o2=a.createOscillator();o2.type='sine';o2.frequency.value=1046.5;const g2=a.createGain();g2.gain.value=.35;o2.connect(g2);g2.connect(g);o.start(t);o2.start(t);holdNode={o,o2,g}}
function holdStop(){if(!holdNode)return;const a=ac();const t=a.currentTime;const {o,o2,g}=holdNode;try{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.05);o.stop(t+.07);o2.stop(t+.07)}catch(e){}holdNode=null}

function showResult({stars,title,msg,sticker,again,done}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="ovc"><h2>${title}</h2><div class="bigstars">${[0,1,2].map(i=>i<stars?'★':'<span class="off">★</span>').join('')}</div><p>${msg}</p>${NQ.coins.round()?`<div class="stk-new">+${NQ.coins.round()} 🪙 coins</div>`:''}${sticker?`<div class="stk-new">New sticker! <b>${sticker}</b></div>`:''}<div class="row"><button class="btn alt" data-r="again">🔁 Again</button><button class="btn" data-r="done">Done</button></div></div>`;

function confirmBox(msg,yesLabel,onYes){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="ovc"><p style="color:#fff">${msg}</p><div class="row"><button class="btn ghost" data-r="no">Cancel</button><button class="btn" data-r="yes">${yesLabel}</button></div></div>`;document.body.appendChild(ov);ov.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;ov.remove();if(b.dataset.r==='yes')onYes()})}
function keyboardHTML(lo=48,hi=72,labels=false){const whites=[];for(let m=lo;m<=hi;m++)if(whiteFromMidi(m))whites.push(m);const w=100/whites.length;let h='';
  whites.forEach((m,i)=>{h+=`<div class="wk" data-midi="${m}" style="left:${i*w}%;width:${w}%">${labels?`<span class="kl">${whiteFromMidi(m)[0]}</span>`:''}${m===60?'<span class="mc">●</span>':''}</div>`});
  whites.forEach((m,i)=>{const L=whiteFromMidi(m)[0];if('CDFGA'.includes(L)&&m+1<=hi)h+=`<div class="bk" data-midi="${m+1}" style="left:${(i+1)*w-w*.3}%;width:${w*.6}%"></div>`});
  return `<div class="kb">${h}</div>`}
function bindKeyboard(root,onKey){const kb=root.querySelector('.kb');if(!kb)return;kb.addEventListener('pointerdown',e=>{const k=e.target.closest('[data-midi]');if(!k)return;e.preventDefault();k.classList.add('press');setTimeout(()=>k.classList.remove('press'),180);onKey(+k.dataset.midi,k)})}
function flashKey(m,cls,ms=600){const k=document.querySelector(`.kb [data-midi="${m}"]`);if(!k)return;k.classList.add(cls);setTimeout(()=>k.classList.remove(cls),ms)}
function micButtonHTML(){return Mic.possible()?`<button class="mic" id="micBtn"><span class="dot"></span><span class="ml">🎤 Listen to my piano</span></button>`:''}
function bindMic(onMidi){const b=$('#micBtn');if(!b)return;b.addEventListener('click',async()=>{if(Mic.on){Mic.stop();b.classList.remove('on');b.querySelector('.ml').textContent='🎤 Listen to my piano';return}
  const ok=await Mic.start(onMidi);if(ok){b.classList.add('on');b.querySelector('.ml').textContent='Listening… play a note';}else{toast('Piano listening isn’t allowed here. Tap the keys instead.');b.remove()}})}
function go(view,arg){if(cleanup){try{cleanup()}catch(e){}cleanup=null}NQ.coins.roundStart();if(Mic.on)Mic.stop();document.querySelectorAll('.ov').forEach(o=>o.remove());curView=view;window.scrollTo(0,0);(VIEWS[view]||VIEWS.profiles)(arg)}

document.addEventListener('contextmenu',e=>e.preventDefault());
function onRemote(){if(['profiles','home','games','shop','planets','stickers','songs','rhythm','map','journal'].includes(curView))go(P()?curView:'profiles')}

/* ---------- Drill: name / find / play ---------- */
VIEWS.drill=(arg)=>{const [lid,mode]=arg.split(':');const L=lvl(lid);const items=levelItems(L);const TOTAL=10;
  let q=0,first=0,tries=0,item=null,prev=null,busy=false;const results=[];const t0=Date.now();
  const title={name:'🔤 Name It',find:'🎹 Find It',play:'👂 Play It'}[mode];
  const letters=LETTERS.filter(l=>L.notes.some(n=>n[0]===l));
  const micOK=Mic.possible();
  const promptTxt={name:'What note is this?',find:'Find this note on the piano!',play:micOK?'Play this note on your piano!':'Play it on your piano, then tap the same key here.'}[mode];
  app.innerHTML=`${topBar(title,'level|'+lid)}<div class="prog" id="prog"></div><div class="paper drill-staff" id="pp"></div><div class="prompt">${promptTxt}</div>
   ${mode==='name'?`<div class="letters">${letters.map(l=>`<button class="lb" data-l="${l}" style="--c:${LCOLOR[l]}">${l}</button>`).join('')}</div>`:keyboardHTML(48,72)}
   ${mode==='play'?`<div class="row" style="margin-top:10px">${micButtonHTML()}<button class="mic" id="hear">🔊 Hear it</button></div>`:`<div class="row" style="margin-top:12px"><button class="mic" id="hear">🔊 Hear it</button></div>`}`;
  function pick(){return NQ.items.pickWeighted(items,prev)}
  function drawProg(){$('#prog').innerHTML=Array.from({length:TOTAL},(_,i)=>`<i class="${i<q?(results[i]?'done':'miss'):i===q?'cur':''}"></i>`).join('')}
  function draw(reveal){const k=nkey(item.note,item.staff);const op=reveal?1:hintOp(k);
    $('#pp').innerHTML=staffSVG({clef:L.staff,s:18,width:L.staff==='grand'?300:300,notes:[{note:item.note,staff:item.staff,x:190,type:'whole',letter:op,color:reveal?'#0c8f6a':'#222'}]})}
  function next(){item=pick();prev=item;tries=0;busy=false;drawProg();draw(false)}
  function answer(ok,el){if(busy)return;const k=nkey(item.note,item.staff);
    if(ok){busy=true;if(tries===0){first++;record(k,true)}results[q]=tries===0;playNote(item.note,.9);if(el)el.classList.add('good');praise($('#pp'));draw(true);
      setTimeout(()=>{if(el)el.classList.remove('good');q++;if(q>=TOTAL)return finish();next()},950)}
    else{if(tries===0)record(k,false);tries++;sfxBad();if(el){el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),400)}
      if(tries>=2){draw(true);if(mode==='name'){const b=app.querySelector(`.lb[data-l="${item.note[0]}"]`);b&&b.classList.add('reveal')}else flashKey(midiOf(item.note),'hint',2500);playNote(item.note,.9)}}}
  function finish(){const stars=NQ.scoring.drill(first);const sticker=finishRound(lid+':'+mode,stars,mode,lid,first,TOTAL,t0);
    showResult({stars,title:stars===3?'Amazing!':stars===2?'Great work!':'Nice try!',msg:`You got ${first} of ${TOTAL} on the first try.`,sticker,again:()=>go('drill',arg),done:()=>go('level',lid)})}
  if(mode==='name')app.querySelectorAll('.lb').forEach(b=>b.addEventListener('click',()=>{app.querySelectorAll('.lb').forEach(x=>x.classList.remove('reveal'));answer(b.dataset.l===item.note[0],b)}));
  else bindKeyboard(app,(m,k)=>{if(busy)return;if(m!==midiOf(item.note))playMidi(m,.5);answer(m===midiOf(item.note),k)});
  $('#hear').addEventListener('click',()=>playNote(item.note));
  if(mode==='play')bindMic(m=>{if(busy)return;const t=midiOf(item.note);if(micMatch(m,t)){flashKey(t,'good');answer(true,null)}else{flashKey(m,'bad');answer(false,null)}});
  next();
};

/* ---------- Meteor Shower (15-meteor + endless) ---------- */
VIEWS.meteor=(arg)=>{const [lid,kind]=arg.split(':');const endless=kind==='endless';const L=lvl(lid);let li=LEVELS.indexOf(L);
  let items=levelItems(L);const GOAL=endless?Infinity:NQ.meteor.GOAL;const best0=NQ.progress.best(lid);
  let mets=[],cleared=0,missed=0,firstRight=0,shields=NQ.meteor.SHIELDS,running=false,raf=0,lastT=0,sinceSpawn=99,uid=0,t0=Date.now(),ended=false,nextAdd=NQ.meteor.NEW_NOTES_EVERY;
  const letterSet=()=>LETTERS.filter(l=>items.some(it=>it.note[0]===l));
  app.innerHTML=`${topBar(endless?'♾️ Endless Meteors':'☄️ Meteor Shower','level|'+lid)}<div class="hud"><span class="shields" id="sh"></span><span id="sc"></span></div>
   <div class="arena" id="ar"><div class="ground"><span class="base">🐶🚀🐱</span></div><div class="center-msg" id="cm"><h2>${endless?'Endless Meteors!':'Meteor Shower!'}</h2><p>${endless?`Blast as many meteors as you can. They get faster, more fall at once, and new notes join in!${best0?`<br><br>🏆 Your best: <b>${best0}</b>`:''}`:'Meteors with notes are falling. Tap the letter for the <b>glowing</b> meteor before it lands!'}</p><button class="btn" id="go">Start ☄️</button></div></div>
   <div class="letters" id="lets" style="margin-top:12px"></div>
   <div class="row" style="margin-top:8px">${micButtonHTML()}</div>`;
  const ar=$('#ar');
  function drawLetters(){$('#lets').innerHTML=letterSet().map(l=>`<button class="lb" data-l="${l}" style="--c:${LCOLOR[l]}">${l}</button>`).join('')}
  $('#lets').addEventListener('click',e=>{const b=e.target.closest('.lb');if(b)answerLetter(b.dataset.l,b)});
  const fallTime=()=>NQ.meteor.fallTime(cleared,endless);
  const maxActive=()=>NQ.meteor.maxActive(cleared,endless);
  function hud(){$('#sh').innerHTML=[0,1,2].map(i=>`<span style="opacity:${i<shields?1:.2}">🛡️</span>`).join('');
    $('#sc').textContent=endless?`☄️ ${cleared}   🏆 ${Math.max(best0,cleared)}`:`☄️ ${cleared} / ${GOAL}`}
  function maybeAdd(){if(!endless||cleared<nextAdd)return;nextAdd+=NQ.meteor.NEW_NOTES_EVERY;const r=NQ.meteor.addNextLevel(li,items);li=r.levelIndex;if(r.added){drawLetters();toast('🌟 New notes from '+r.level.name+'!')}}
  function spawn(){const it=items[Math.floor(Math.random()*items.length)];const k=nkey(it.note,it.staff);
    const el=document.createElement('div');el.className='met';const W=ar.clientWidth;
    const lanes=[.03,.36,.69];const used=mets.filter(m=>m.y<220).map(m=>m.lane);const free=lanes.map((_,i)=>i).filter(i=>!used.includes(i));const lane=free.length?free[Math.floor(Math.random()*free.length)]:Math.floor(Math.random()*3);
    el.style.left=Math.min(W-190,Math.max(4,lanes[lane]*W+(Math.random()*24-12)))+'px';
    el.innerHTML=`<div class="trail"></div><div class="rock">${staffSVG({clef:it.staff,s:14,width:164,topPad:30,botPad:30,clefX:8,notes:[{note:it.note,staff:it.staff,x:112,type:'whole',letter:hintOp(k)}]})}</div>`;
    ar.appendChild(el);const m={id:++uid,el,it,k,y:-170,lane,wrong:0,dead:false};el.style.transform=`translateY(${m.y}px)`;mets.push(m);sinceSpawn=0}
  function target(){let t=null;for(const m of mets)if(!m.dead&&(!t||m.y>t.y))t=m;return t}
  function mark(){const t=target();mets.forEach(m=>m.el.classList.toggle('target',m===t))}
  function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-(lastT||ts))/1000);lastT=ts;sinceSpawn+=dt;
    const H=ar.clientHeight;const speed=(H+100)/fallTime();
    for(const m of mets){if(m.dead)continue;const ground=H-46-(m.h||(m.h=m.el.offsetHeight||130));m.y+=speed*dt;m.el.style.transform=`translateY(${m.y}px)`;if(m.y>=ground)land(m)}
    const live=mets.filter(m=>!m.dead).length;
    if(!ended&&cleared<GOAL&&shields>0&&((live===0&&sinceSpawn>.7)||(live<maxActive()&&sinceSpawn>NQ.meteor.spawnGap(cleared,endless))))spawn();
    mark();raf=requestAnimationFrame(loop)}
  function land(m){m.dead=true;m.el.classList.remove('target');if(!m.wrong)record(m.k,false);missed++;shields--;sfxBad();playNote(m.it.note,.8);
    m.el.querySelector('.rock').innerHTML=`<div style="font-size:30px;font-weight:700;text-align:center;padding:22px 0;color:#c0392b">${nice(m.it.note)}</div>`;
    setTimeout(()=>m.el.remove(),900);mets=mets.filter(x=>x!==m);hud();if(shields<=0)end()}
  function answerLetter(l,btn){if(!running)return;const t=target();if(!t)return;
    if(t.it.note[0]===l){t.dead=true;if(!t.wrong){firstRight++;record(t.k,true)}cleared++;playNote(t.it.note,.7);
      t.el.classList.add('boom');t.el.insertAdjacentHTML('beforeend','<div class="burst">💥</div>');setTimeout(()=>t.el.remove(),500);mets=mets.filter(x=>x!==t);
      if(btn){btn.classList.add('good');setTimeout(()=>btn.classList.remove('good'),300)}hud();maybeAdd();if(cleared>=GOAL)end()}
    else{if(!t.wrong)record(t.k,false);t.wrong++;sfxBad();t.el.classList.add('wrong');setTimeout(()=>t.el.classList.remove('wrong'),400);
      if(btn){btn.classList.add('bad');setTimeout(()=>btn.classList.remove('bad'),400)}
      if(t.wrong>=2){t.el.querySelector('.rock').innerHTML=staffSVG({clef:t.it.staff,s:14,width:164,topPad:30,botPad:30,clefX:8,notes:[{note:t.it.note,staff:t.it.staff,x:112,type:'whole',letter:1,color:'#0c8f6a'}]})}}}
  function end(){if(ended)return;ended=true;running=false;cancelAnimationFrame(raf);const tot=cleared+missed;let stars,res;
    if(endless){stars=NQ.scoring.endless(cleared);const newBest=cleared>best0;if(newBest)NQ.progress.setBest(lid,cleared);const sticker=finishRound(lid+':endless',stars,'endless',lid,firstRight,tot,t0);
      res={stars,title:newBest&&cleared>0?'New record! 🏆':'Game over!',msg:`You blasted ${cleared} meteors!`+(newBest&&best0?` Old best was ${best0}.`:(!newBest?` Best: ${best0}.`:'')),sticker}}
    else{stars=NQ.scoring.meteor({shields,cleared,firstRight,total:tot});const sticker=finishRound(lid+':meteor',stars,'meteor',lid,firstRight,tot,t0);
      res={stars,title:shields>0?'You saved the planet!':'So close!',msg:shields>0?`You blasted all ${GOAL} meteors!`:`You blasted ${cleared} meteors. Try again!`,sticker}}
    setTimeout(()=>showResult({...res,again:()=>go('meteor',arg),done:()=>go('level',lid)}),600)}
  $('#go').addEventListener('click',()=>{ac();$('#cm').remove();running=true;lastT=0;t0=Date.now();raf=requestAnimationFrame(loop)});
  bindMic(m=>{if(!running)return;const t=target();if(!t)return;answerLetter(micMatch(m,midiOf(t.it.note))?t.it.note[0]:'x',null)});
  const vis=()=>{if(document.hidden&&running){running=false;cancelAnimationFrame(raf);ar.insertAdjacentHTML('beforeend','<div class="center-msg" id="cm"><h2>Paused</h2><button class="btn" id="resume">Keep going ▶</button></div>');$('#resume').addEventListener('click',()=>{$('#cm').remove();running=true;lastT=0;raf=requestAnimationFrame(loop)})}};
  document.addEventListener('visibilitychange',vis);
  drawLetters();hud();
  cleanup=()=>{running=false;ended=true;cancelAnimationFrame(raf);document.removeEventListener('visibilitychange',vis)};
};

/* ---------- Unicorn Rescue ---------- */
VIEWS.unicorn=()=>{const p=P();const pool=NQ.items.unlockedPool();
  const clef=NQ.items.clefFor(pool);
  const letters=NQ.items.lettersFor(pool);
  let mode=p.uniMode||'keys';
  let hero=NQ.unicorn.HERO_START,heroT=hero,uni=NQ.unicorn.UNI_START,uniT=uni,running=false,ended=false,raf=0,last=0,item=null,prev=null,tries=0,misses=0,right=0,firstRight=0,asked=0,busy=false;const t0=Date.now();
  app.innerHTML=`${topBar('🦄 Unicorn Rescue','games')}
   <div class="scene" id="scene"><div class="sun">🌈</div><div class="rainbow"></div>
    <div class="cloud" id="cloud"><span class="b2">⛈️</span><span class="wind">💨</span></div>

    <div class="hero" id="hero"><span class="b">${p.avatar==='🦄'?'🐶':p.avatar}</span></div>
    <div class="center-msg" id="cm"><h2>Save the unicorn!</h2><p>A grumpy storm cloud is blowing the unicorn away! Play the right notes to gallop closer and catch her before she’s gone.</p><button class="btn" id="go">Start 🦄</button></div></div>
   <div class="paper uni-staff" id="pp"></div>
   <div class="row" style="margin:10px 0 2px"><span class="mode-tog"><button data-m="keys" class="${mode==='keys'?'on':''}">🎹 Keys</button><button data-m="letters" class="${mode==='letters'?'on':''}">🔤 Letters</button></span>${micButtonHTML()}</div>
   <div id="ans"></div>`;
  const sc=$('#scene');
  function drawAns(){$('#ans').innerHTML=mode==='keys'?keyboardHTML(48,72):`<div class="letters">${letters.map(l=>`<button class="lb" data-l="${l}" style="--c:${LCOLOR[l]}">${l}</button>`).join('')}</div>`;
    if(mode==='keys')bindKeyboard($('#ans'),(m,k)=>{if(!running||busy)return;const ok=m===midiOf(item.note);if(!ok)playMidi(m,.4);answer(ok,k)})}
  $('#ans').addEventListener('click',e=>{const b=e.target.closest('.lb');if(!b||!running||busy)return;app.querySelectorAll('.lb').forEach(x=>x.classList.remove('reveal'));answer(b.dataset.l===item.note[0],b)});
  app.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;NQ.profiles.setOption(p.id,'uniMode',mode);app.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));drawAns()}));
  function drawStaff(reveal){if(!item){$('#pp').innerHTML=staffSVG({clef,s:16,width:300,notes:[]});return}const k=nkey(item.note,item.staff);
    $('#pp').innerHTML=staffSVG({clef,s:16,width:300,notes:[{note:item.note,staff:item.staff,x:190,type:'whole',letter:reveal?1:hintOp(k),color:reveal?'#0c8f6a':'#222'}]})}
  function next(){item=NQ.items.pickRandom(pool,prev);prev=item;tries=0;busy=false;asked++;drawStaff(false)}
  function place(){$('#hero').style.left=hero+'%';$('#uni').style.left=uni+'%';$('#cloud').style.left=Math.min(uni+9,99)+'%'}
  function answer(ok,el){const k=nkey(item.note,item.staff);
    if(ok){busy=true;right++;if(tries===0){firstRight++;record(k,true)}playNote(item.note,.8);heroT+=NQ.unicorn.STEP;$('#hero').classList.add('jump');setTimeout(()=>$('#hero').classList.remove('jump'),400);
      if(el){el.classList.add('good');setTimeout(()=>el.classList.remove('good'),350)}drawStaff(true);setTimeout(()=>{if(running)next()},550)}
    else{if(tries===0)record(k,false);tries++;misses++;sfxBad();uniT+=NQ.unicorn.GUST;$('#cloud').classList.add('gust');setTimeout(()=>$('#cloud').classList.remove('gust'),500);
      if(el){el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),400)}
      if(tries>=2){drawStaff(true);playNote(item.note,.8);if(mode==='letters'){const b=app.querySelector(`.lb[data-l="${item.note[0]}"]`);b&&b.classList.add('reveal')}else flashKey(midiOf(item.note),'hint',2500)}}}
  function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
    uniT+=NQ.unicorn.drift(right)*dt;hero+=(heroT-hero)*Math.min(1,dt*7);uni+=(uniT-uni)*Math.min(1,dt*7);place();
    if(NQ.unicorn.caught(hero,uni))return win();if(NQ.unicorn.lost(uni))return lose();raf=requestAnimationFrame(loop)}
  function win(){running=false;ended=true;$('#cloud').innerHTML='<span class="b2">🌤️</span>';$('#cloud').classList.add('poof');sc.insertAdjacentHTML('beforeend','<div class="hearts">💖✨💖</div>');sfxGood();
    const stars=NQ.unicorn.stars(misses);const st=finishRound('unicorn',stars,'unicorn','U',firstRight,asked,t0);
    setTimeout(()=>showResult({stars,title:'You saved the unicorn! 🦄',msg:misses?`You caught her with only ${misses} oops note${misses>1?'s':''}!`:'Perfect rescue. Not a single miss!',sticker:st,again:()=>go('unicorn'),done:()=>go('games')}),1400)}
  function lose(){running=false;ended=true;$('#uni').classList.add('away');sfxBad();const st=finishRound('unicorn',0,'unicorn','U',firstRight,asked,t0);
    setTimeout(()=>showResult({stars:0,title:'The storm cloud got away!',msg:'The unicorn is still out there. Try again and catch her!',sticker:st,again:()=>go('unicorn'),done:()=>go('games')}),1200)}
  $('#go').addEventListener('click',()=>{ac();$('#cm').remove();running=true;last=0;next();raf=requestAnimationFrame(loop)});
  bindMic(m=>{if(!running||busy)return;const t=midiOf(item.note);if(micMatch(m,t)){flashKey(t,'good');answer(true,null)}else{flashKey(m,'bad');answer(false,null)}});
  drawAns();drawStaff(false);place();
  cleanup=()=>{running=false;cancelAnimationFrame(raf)};
};

VIEWS.beats=()=>{const TOTAL=NQ.rhythm.BEATS_TOTAL;let q=0,first=0,tries=0,cur=0,prev=0,busy=false;const t0=Date.now();
  app.innerHTML=`${topBar('🔢 How Many Beats?','rhythm')}<div class="paper drill-staff" style="text-align:center" id="nv"></div><div class="prompt" id="nvn">How many beats?</div><div class="beats">${[1,2,3,4].map(b=>`<button class="lb" data-b="${b}" style="--c:${['','#ff6fae','#4aa3ff','#ffd23f','#3ee6c4'][b]}">${b}</button>`).join('')}</div><div class="prog" id="prog" style="margin-top:16px"></div>`;
  function next(){cur=NQ.rhythm.beatsQuestion(prev);prev=cur;tries=0;busy=false;$('#nv').innerHTML=noteValueSVG(cur);$('#nvn').textContent='How many beats?';$('#prog').innerHTML=Array.from({length:TOTAL},(_,i)=>`<i class="${i<q?'done':i===q?'cur':''}"></i>`).join('')}
  app.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{if(busy)return;const v=+b.dataset.b;
    if(v===cur){busy=true;if(!tries){first++;NQ.coins.rewardNotes(1)}b.classList.add('good');$('#nvn').textContent=`${VALUE_NAME[cur]} = ${cur} beat${cur>1?'s':''}!`;for(let i=0;i<cur;i++)click(i*.45,i===0);praise($('#nv'));
      setTimeout(()=>{b.classList.remove('good');q++;if(q>=TOTAL){const stars=NQ.scoring.beats(first);const st=finishRound('rhythm:count',stars,'beats','R',first,TOTAL,t0);showResult({stars,title:'Beat buddy!',msg:`${first} of ${TOTAL} right on the first try.`,sticker:st,again:()=>go('beats'),done:()=>go('rhythm')})}else next()},Math.max(1100,cur*450+300))}
    else{tries++;sfxBad();b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400)}}));

VIEWS.tap=()=>{const ROUNDS=NQ.rhythm.ROUNDS,BPM=NQ.rhythm.BPM,spb=60/BPM;let r=0,pts=0,notesTot=0;const t0=Date.now();
  let raf=0,state='idle',pat=null,bpm=4,start=0,presses=[],downAt=null,onsets=[],durs=[],totalBeats=8,lat=0,X0=62,X1=624,unit=1;
  app.innerHTML=`${topBar('🥁 Tap Along','rhythm')}<div class="prog" id="prog"></div><div class="paper" id="rp"><div id="rs"></div></div>
   <div class="count" id="ct"></div><button class="holdbtn" id="hb"><span>HOLD</span></button>
   <div class="row" style="margin-top:26px"><button class="btn" id="startB">▶ Start</button></div>
   <p class="note-tip">Press when a note starts and <b>keep holding</b> for all its beats. Short notes = short holds, long notes = long holds!</p>`;
  const xb=b=>X0+b*unit;
  function build(){const flat=pat.flat();totalBeats=bpm*2;unit=(X1-X0)/totalBeats;
    let g=`<svg viewBox="0 0 640 175" style="width:100%;height:auto;display:block" font-family="Fredoka,Arial,sans-serif">`;
    g+=`<line x1="10" x2="630" y1="70" y2="70" stroke="#333" stroke-width="2"/><text x="32" y="64" font-size="34" font-weight="700" text-anchor="middle" font-family="Georgia,serif">${bpm}</text><text x="32" y="98" font-size="34" font-weight="700" text-anchor="middle" font-family="Georgia,serif">4</text>`;
    g+=`<line x1="${xb(bpm)}" x2="${xb(bpm)}" y1="48" y2="92" stroke="#333" stroke-width="2"/><line x1="${X1+2}" x2="${X1+2}" y1="48" y2="92" stroke="#333" stroke-width="5"/>`;
    let b=0;flat.forEach((d,i)=>{const x=xb(b)+16,t=typeFor(d),filled=t==='quarter';
      if(t!=='whole')g+=`<line x1="${x+9}" x2="${x+9}" y1="70" y2="26" stroke="#222" stroke-width="2.6"/>`;
      g+=`<ellipse cx="${x}" cy="70" rx="${t==='whole'?12:10}" ry="${t==='whole'?8.5:7.5}" transform="rotate(-20 ${x} 70)" fill="${filled?'#222':'#fff'}" stroke="#222" stroke-width="2.6"/>`;
      if(t==='dhalf')g+=`<circle cx="${x+18}" cy="65" r="2.6" fill="#222"/>`;
      const bx=xb(b)+5,bw=d*unit-10;g+=`<rect x="${bx}" y="112" width="${bw}" height="18" rx="9" fill="#e6e1ff"/><rect id="f${i}" x="${bx}" y="112" width="0" height="18" rx="9" fill="#3ee6c4"/>`;
      const lab=[];const inM=b%bpm;for(let k=0;k<d;k++)lab.push(inM+k+1);g+=`<text x="${bx+bw/2}" y="152" font-size="17" text-anchor="middle" fill="#6a5acd" font-weight="600">${lab.join(' ')}</text>`;
      g+=`<text id="m${i}" x="${x}" y="20" font-size="20" text-anchor="middle"></text>`;b+=d});
    g+=`<line id="ph" x1="${X0}" x2="${X0}" y1="8" y2="136" stroke="#ff4f9a" stroke-width="4" stroke-linecap="round" style="display:none"/></svg>`;
    $('#rs').innerHTML=g;onsets=[];durs=[];b=0;flat.forEach(d=>{onsets.push(b*spb);durs.push(d*spb);b+=d})}
  function newPat(){const np=NQ.rhythm.newPattern();bpm=np.beatsPerMeasure;pat=np.measures;build();
    $('#prog').innerHTML=Array.from({length:ROUNDS},(_,i)=>`<i class="${i<r?'done':i===r?'cur':''}"></i>`).join('');$('#startB').style.display='';$('#ct').textContent='';state='idle'}
  const heard=()=>ac().currentTime-lat;
  function run(){const a=ac();if(!a){toast('Sound isn’t available on this device.');return}$('#startB').style.display='none';presses=[];downAt=null;
    lat=Math.min(.4,Math.max(0,(a.outputLatency||0)+(a.baseLatency||0)))+(NQ.settings.get('latAdj')||0);
    start=a.currentTime+.5+bpm*spb;for(let i=0;i<bpm;i++)clickAt(start-(bpm-i)*spb,i===0);for(let i=0;i<totalBeats;i++)clickAt(start+i*spb,i%bpm===0,true);
    state='run';raf=requestAnimationFrame(tick)}
  function tick(){const now=heard();const beat=(now-start)/spb;const ph=$('#ph');
    if(beat<0){const c=Math.floor(beat+bpm)+1;$('#ct').innerHTML=c>=1?`<span style="opacity:.8">${c}</span>`:'Get ready…';ph.style.display='none'}
    else if(beat<totalBeats){$('#ct').innerHTML=`<span style="color:#3ee6c4">${Math.floor(beat)%bpm+1}</span>`;ph.style.display='';const x=xb(beat);ph.setAttribute('x1',x);ph.setAttribute('x2',x)}
    if(downAt!==null){const i=onsets.findIndex(o=>Math.abs(downAt-start-o)<=.3);if(i>=0){const f=$('#f'+i);const full=durs[i]/spb*unit-10;f.setAttribute('width',Math.max(0,Math.min(full,(now-downAt)/spb*unit)))}}
    if(beat>=totalBeats+.35){finish();return}raf=requestAnimationFrame(tick)}
  function finish(){state='idle';cancelAnimationFrame(raf);$('#ph').style.display='none';if(downAt!==null){presses.push([downAt,heard()]);downAt=null;holdStop();$('#hb').classList.remove('down')}
    const J=NQ.rhythm.judge({start,onsets,durs,presses});const perfect=J.perfect,close=J.close;
    J.results.forEach((r,i)=>{const m=$('#m'+i),f=$('#f'+i),full=durs[i]/spb*unit-10;
      if(r.result==='miss'){m.textContent='❌';f.setAttribute('width',0);return}
      f.setAttribute('width',Math.max(4,Math.min(full,r.held/spb*unit)));
      if(r.result==='perfect'){m.textContent='✅'}else{m.textContent='🟡';f.setAttribute('fill','#ffd23f')}});
    const n=onsets.length;NQ.coins.rewardNotes(perfect);pts+=J.points;notesTot+=n;
    $('#ct').innerHTML=perfect===n?'Perfect! 🎉':`<span style="font-size:24px">✅ ${perfect}  🟡 ${close}  ❌ ${n-perfect-close}${close?'<br>🟡 = right start, hold it the right length':''}</span>`;if(perfect===n)sfxGood();
    r++;setTimeout(()=>{if(curView!=='tap')return;if(r>=ROUNDS){const pct=pts/notesTot;const stars=NQ.scoring.tap(pct);const st=finishRound('rhythm:tap',stars,'tap','R',Math.round(pts),notesTot,t0);
      showResult({stars,title:'Rockin’ rhythm!',msg:`You scored ${Math.round(pct*100)}% on the beat.`,sticker:st,again:()=>go('tap'),done:()=>go('rhythm')})}else newPat()},2600)}
  const hb=$('#hb');
  hb.addEventListener('pointerdown',e=>{e.preventDefault();ac();try{hb.setPointerCapture(e.pointerId)}catch(x){}hb.classList.add('down');holdStart();if(state==='run')downAt=heard()});
  const up=()=>{if(!hb.classList.contains('down'))return;hb.classList.remove('down');holdStop();if(state==='run'&&downAt!==null){presses.push([downAt,heard()]);downAt=null}};
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>hb.addEventListener(ev,up));
  $('#startB').addEventListener('click',run);newPat();
  cleanup=()=>{cancelAnimationFrame(raf);holdStop();state='idle'};
};

VIEWS.songs=()=>{const p=P();

VIEWS.song=(id)=>{const song=NQ.songs.get(id);const seq=song.seq;let noteMiss=false,idx=-1,mode='idle',mistakes=0,letters=P().hints!=='never',timers=[],t0=Date.now(),keyHelp=false;
  const meas=NQ.songs.measures(song);
  const perSys=window.innerWidth<600?2:4;
  app.innerHTML=`${topBar(song.icon+' '+song.title,'songs')}<div class="song-wrap"><div class="paper" id="sp"></div></div>
   <div class="song-ctrl"><button class="btn small alt" id="listen">🔊 Listen</button><button class="btn small" id="playB">🎹 Play along</button><button class="toggle ${letters?'on':''}" id="letT">🔤 Letters</button><button class="toggle" id="keyT">💡 Key help</button>${micButtonHTML()}</div>
   <div class="prompt" id="sMsg" style="font-size:20px">Tap Listen to hear it, or Play along to play it yourself.</div>${keyboardHTML(48,72)}`;
  function render(){const s=16,W=640;let h='';
    for(let si=0;si<meas.length;si+=perSys){const ms=meas.slice(si,si+perSys);const first=si===0;const startX=first?s*6.4:s*4.2;const mw=(W-startX-10)/perSys;const notes=[],bars=[];
      ms.forEach((mi,k)=>{const x0=startX+k*mw;let off=0;mi.forEach(i=>{const n=seq[i];const x=x0+s*1.3+(off/song.ts)*(mw-s*2.2);off+=n.beats;
        const isCur=i===idx;notes.push({note:n.note,staff:NQ.songs.staffFor(song,n.note),x,type:typeFor(n.beats),letter:letters?1:0,color:isCur?'#e0287a':(i<idx&&mode==='play'?'#0c8f6a':'#222'),glow:isCur?'#ff6fae':null,i})});
        bars.push(x0+mw)});
      h+=staffSVG({clef:song.staff,s,width:W,notes,bars:bars.slice(0,-1),final:si+perSys>=meas.length,ts:first?String(song.ts):null,topPad:s*2.6,botPad:s*2.4,gap:s*3.4});}
    $('#sp').innerHTML=h;const c=$('#sp .nh[data-i="'+idx+'"]');if(c&&mode!=='idle'){const r=c.getBoundingClientRect();if(r.top<70||r.bottom>window.innerHeight*.55)window.scrollBy({top:r.top-120,behavior:'smooth'})}}
  function stopAll(){timers.forEach(clearTimeout);timers=[];mode='idle';$('#listen').textContent='🔊 Listen';$('#playB').textContent='🎹 Play along'}
  function hintKey(){document.querySelectorAll('.kb .hint').forEach(k=>k.classList.remove('hint'));if(keyHelp&&mode==='play'&&idx>=0&&idx<seq.length){const k=document.querySelector(`.kb [data-midi="${midiOf(seq[idx].note)}"]`);k&&k.classList.add('hint')}}
  $('#listen').addEventListener('click',()=>{if(mode==='listen'){stopAll();idx=-1;render();return}stopAll();mode='listen';$('#listen').textContent='⏹ Stop';const spb=60/96;let t=0;
    seq.forEach((n,i)=>{const at=t;timers.push(setTimeout(()=>{idx=i;playNote(n.note,Math.max(.5,n.beats*spb*.95));flashKey(midiOf(n.note),'press',n.beats*spb*800);render()},at*1000+80));t+=n.beats*spb});
    timers.push(setTimeout(()=>{stopAll();idx=-1;render()},t*1000+400))});
  $('#playB').addEventListener('click',()=>{if(mode==='play'){stopAll();idx=-1;render();hintKey();$('#sMsg').textContent='Tap Listen to hear it, or Play along to play it yourself.';return}stopAll();mode='play';mistakes=0;t0=Date.now();idx=0;$('#playB').textContent='⏹ Stop';$('#sMsg').textContent='Play the pink note!';render();hintKey()});
  $('#letT').addEventListener('click',e=>{letters=!letters;e.currentTarget.classList.toggle('on',letters);render()});
  $('#keyT').addEventListener('click',e=>{keyHelp=!keyHelp;e.currentTarget.classList.toggle('on',keyHelp);hintKey()});
  function got(m,fromMic){if(mode!=='play')return;const want=midiOf(seq[idx].note);const ok=fromMic?micMatch(m,want):m===want;
    if(ok){if(!noteMiss)NQ.coins.rewardNotes(1);noteMiss=false;if(!fromMic)playMidi(want,Math.max(.4,seq[idx].beats*.5));flashKey(want,'good',300);idx++;if(idx>=seq.length){const stars=NQ.scoring.oops(mistakes);mode='idle';hintKey();render();const st=finishRound('song:'+song.id,stars,'song',song.id,seq.length,seq.length+mistakes,t0);
        showResult({stars,title:'You played '+song.title+'!',msg:mistakes?`Only ${mistakes} oops note${mistakes>1?'s':''}!`:'Not a single mistake!',sticker:st,again:()=>go('song',id),done:()=>go('songs')});$('#playB').textContent='🎹 Play along';return}
      render();hintKey()}
    else{noteMiss=true;if(!fromMic)playMidi(m,.35);mistakes++;sfxBad();flashKey(m,'bad',300);$('#sMsg').textContent=`Oops! Look for ${nice(seq[idx].note)}.`;setTimeout(()=>{if(mode==='play')$('#sMsg').textContent='Play the pink note!'},1500)}}
  bindKeyboard(app,(m)=>{if(mode==='play')got(m,false);else playMidi(m,.6)});
  bindMic(m=>got(m,true));
  render();cleanup=()=>{timers.forEach(clearTimeout)};
};
