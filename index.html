<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Note Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0b1030; --bg2:#1d1554; --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.14);
  --ink:#fff; --dim:#b9c0ff; --gold:#ffd23f; --teal:#3ee6c4; --pink:#ff6fae; --purple:#8b6cff; --red:#ff5d5d;
  --paper:#fffaf0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 20% 0%,#2a1f7a 0%,transparent 55%),radial-gradient(ellipse at 90% 100%,#0f4a6e 0%,transparent 50%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100vh;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.15}}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:12px 14px 40px;min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;border:none;cursor:pointer;background:none}
h1,h2,h3{margin:0;font-weight:600}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:52px}
.top h1{font-size:26px;flex:1}
.back{width:52px;height:52px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:26px}
.me{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-size:18px;font-weight:600}
.me .av{font-size:26px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:20px 16px;text-align:center;transition:transform .12s;position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:56px;line-height:1.1}
.tile .nm{font-size:22px;font-weight:600}
.tile .sub{font-size:14px;color:var(--dim)}
.tile.locked{opacity:.45}
.tile .lock{position:absolute;top:10px;right:14px;font-size:22px}
.stars{color:var(--gold);font-size:20px;letter-spacing:2px}
.stars .off{color:rgba(255,255,255,.22)}
.big-title{text-align:center;margin:18px 0 6px}
.big-title .logo{font-size:64px}
.big-title h1{font-size:44px;letter-spacing:1px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.big-title p{color:var(--dim);font-size:20px;margin:4px 0 0}
.pcard .ic{font-size:70px}
.add .ic{font-size:50px;opacity:.8}
.hold{position:relative;overflow:hidden;margin:26px auto 0;display:block;padding:14px 26px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:16px;color:var(--dim)}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(62,230,196,.35);transition:width 0s}
.hold.on .fill{width:100%;transition:width 3s linear}
.hold span.t{position:relative}
.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:14px;opacity:.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:999px;font-size:20px;font-weight:600;background:linear-gradient(180deg,#ffe066,#ffc21a);color:#3a2600;box-shadow:0 5px 0 #c98f00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c98f00}
.btn.alt{background:linear-gradient(180deg,#7ff5dc,#2fd3b1);color:#033;box-shadow:0 5px 0 #16977d}
.btn.ghost{background:var(--card);color:#fff;box-shadow:none;border:2px solid var(--line)}
.btn.small{padding:9px 16px;font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.paper{background:var(--paper);border-radius:26px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);color:#222;position:relative}
.paper svg{display:block;margin:0 auto}
.drill-staff{max-width:640px;width:100%;margin:0 auto}
.prompt{text-align:center;font-size:24px;margin:14px 0 10px;font-weight:500}
.prog{display:flex;gap:6px;justify-content:center;margin:2px 0 12px}
.prog i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
.prog i.done{background:var(--teal)}
.prog i.miss{background:var(--gold)}
.prog i.cur{background:#fff;transform:scale(1.25)}
.letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.lb{width:78px;height:78px;border-radius:50%;font-size:38px;font-weight:700;background:#fff;color:#222;border:6px solid var(--c,#ccc);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.lb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.lb.good{background:#c9ffe9;animation:pop .35s}
.lb.bad{background:#ffd0d0;animation:shake .35s}
.lb.reveal{box-shadow:0 0 0 6px var(--gold),0 5px 0 rgba(0,0,0,.35)}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.kb{position:relative;height:170px;width:100%;max-width:820px;margin:10px auto 0;touch-action:none}
.wk{position:absolute;top:0;bottom:0;background:linear-gradient(#fff,#f1f1f1);border:2px solid #333;border-radius:0 0 10px 10px;box-shadow:inset 0 -6px 0 #ddd}
.wk .mc{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--pink)}
.wk .kl{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-weight:700;color:#777;font-size:16px}
.bk{position:absolute;top:0;height:60%;background:linear-gradient(#333,#111);border-radius:0 0 7px 7px;z-index:2;box-shadow:inset 0 -5px 0 #000}
.wk.press{background:#e3f6ff}
.wk.good{background:#b9ffe0}
.wk.bad{background:#ffc7c7}
.wk.hint{background:#fff3b0;box-shadow:inset 0 -6px 0 var(--gold)}
.bk.press{background:#555}
.mic{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:17px}
.mic.on{background:rgba(255,111,174,.25);border-color:var(--pink)}
.mic .dot{width:12px;height:12px;border-radius:50%;background:#888}
.mic.on .dot{background:var(--pink);animation:tw 1s infinite}
.note-tip{text-align:center;color:var(--dim);font-size:15px;margin-top:6px}
/* result overlay */
.ov{position:fixed;inset:0;background:rgba(5,6,25,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.ovc{background:linear-gradient(180deg,#2c2290,#1a1560);border:3px solid var(--line);border-radius:30px;padding:26px 22px;text-align:center;max-width:440px;width:100%;animation:pop .4s}
.ovc h2{font-size:32px;margin-bottom:8px}
.ovc .bigstars{font-size:58px;letter-spacing:6px;color:var(--gold);margin:6px 0}
.ovc .bigstars .off{color:rgba(255,255,255,.2)}
.ovc p{font-size:19px;color:var(--dim);margin:8px 0 18px}
.stk-new{font-size:20px;margin:6px 0 16px}
.stk-new b{font-size:60px;display:block;animation:pop .6s}
.conf{position:fixed;top:-40px;font-size:28px;z-index:60;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150px);background:#fff;color:#222;padding:12px 20px;border-radius:16px;font-size:17px;z-index:70;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateX(-50%) translateY(0)}
.praise{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;color:#0c8f6a;pointer-events:none;animation:rise 1s forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110%)}}
/* meteor */
.arena{position:relative;height:calc(100vh - 290px);min-height:340px;border-radius:26px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3b2a8a 0%,transparent 60%),linear-gradient(#070a22,#151046);border:2px solid var(--line)}
.ground{position:absolute;left:0;right:0;bottom:0;height:46px;background:radial-gradient(ellipse at 50% 0%,#8a6cff,#4b3ab0 70%);border-top:3px solid #b9a8ff}
.ground .base{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:34px}
.met{position:absolute;width:184px;transition:filter .2s}
.met .trail{position:absolute;left:50%;top:-56px;width:46px;height:70px;transform:translateX(-50%);background:linear-gradient(transparent,rgba(255,170,60,.55),rgba(255,90,40,.8));border-radius:50% 50% 40% 40%;filter:blur(3px)}
.met .rock{position:relative;background:var(--paper);border-radius:22px;border:4px solid #ffb347;padding:2px 4px;box-shadow:0 0 18px rgba(255,150,60,.55)}
.met.target .rock{border-color:var(--teal);box-shadow:0 0 0 4px rgba(62,230,196,.35),0 0 26px rgba(62,230,196,.8)}
.met.wrong .rock{animation:shake .35s}
.met.boom{pointer-events:none}
.met.boom .rock,.met.boom .trail{opacity:0;transform:scale(1.6);transition:all .35s}
.met .burst{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:70px;animation:pop .4s}
.hud{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:20px}
.hud .shields{font-size:26px;letter-spacing:4px}
.center-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;z-index:5}
.center-msg h2{font-size:34px}
.center-msg p{font-size:19px;color:var(--dim);margin:0;max-width:420px}
/* songs */
.song-wrap .paper{padding:10px 6px}
.song-ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0 4px}
.toggle{padding:10px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:17px}
.toggle.on{background:rgba(62,230,196,.25);border-color:var(--teal)}
/* rhythm */
.drum{width:190px;height:190px;border-radius:50%;margin:16px auto 0;display:flex;align-items:center;justify-content:center;font-size:84px;background:radial-gradient(circle at 40% 35%,#ff9ccc,#e03d87);box-shadow:0 10px 0 #9c1f59;touch-action:none}
.drum.hit{transform:translateY(6px);box-shadow:0 4px 0 #9c1f59}
.count{font-size:46px;text-align:center;height:56px;color:var(--gold);font-weight:700}
.playhead{position:absolute;top:8px;bottom:8px;width:4px;background:var(--pink);border-radius:2px;left:0;display:none}
.beats{display:flex;gap:14px;justify-content:center;margin-top:14px}
.beats .lb{width:84px;height:84px;font-size:40px}
/* stickers */
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.stk{aspect-ratio:1;border-radius:20px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:44px}
.stk.no{font-size:26px;color:rgba(255,255,255,.25)}
.sec-h{font-size:20px;margin:18px 0 10px;color:var(--dim)}
/* forms */
input.txt{font-family:inherit;font-size:26px;padding:14px 18px;border-radius:18px;border:3px solid var(--line);background:rgba(255,255,255,.95);color:#222;width:100%;max-width:420px;text-align:center;user-select:text;-webkit-user-select:text}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:520px;margin:18px auto}
.avb{font-size:44px;aspect-ratio:1;border-radius:20px;background:var(--card);border:3px solid transparent}
.avb.sel{border-color:var(--gold);background:rgba(255,210,63,.18)}
/* parent */
.pv{background:#f6f7fb;color:#1d2240;border-radius:24px;padding:18px;margin-bottom:14px}
.pv h3{font-size:19px;margin-bottom:10px}
.pv .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.kpi{background:#fff;border-radius:16px;padding:12px;border:1px solid #e3e6f0}
.kpi b{display:block;font-size:26px}
.kpi span{font-size:13px;color:#667}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:9px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:17px}
.tab.on{background:#fff;color:#1d2240}
.nrow{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #e7e9f2;font-size:15px}
.bar{height:14px;border-radius:7px;background:#e7e9f2;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px}
.days{display:flex;gap:8px;align-items:flex-end;height:110px;padding-top:6px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:#667}
.days div i{display:block;width:70%;background:#8b6cff;border-radius:6px 6px 2px 2px;min-height:2px}
.seg{display:inline-flex;border:2px solid #d5d9e8;border-radius:999px;overflow:hidden}
.seg button{padding:8px 14px;font-size:15px;color:#1d2240}
.seg button.on{background:#1d2240;color:#fff}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e7e9f2;font-size:16px;flex-wrap:wrap}
.pbtn{padding:8px 14px;border-radius:12px;border:2px solid #d5d9e8;font-size:15px;color:#1d2240;background:#fff}
.pbtn.danger{border-color:#ffb3b3;color:#c02525}
.miss-list span{display:inline-block;background:#ffe3ec;color:#a3164a;padding:6px 12px;border-radius:999px;margin:3px;font-size:15px}
.meet-name{text-align:center;font-size:54px;font-weight:700;height:70px;color:var(--gold)}
.holdbtn{width:200px;height:200px;border-radius:50%;margin:8px auto 0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;letter-spacing:2px;background:radial-gradient(circle at 40% 35%,#ff9ccc,#e03d87);box-shadow:0 10px 0 #9c1f59;touch-action:none;color:#fff}
.holdbtn.down{transform:translateY(6px);box-shadow:0 4px 0 #157a65,0 0 0 10px rgba(62,230,196,.25);background:radial-gradient(circle at 40% 35%,#a5f9e8,#2fd3b1)}
.scene{position:relative;height:250px;border-radius:26px;overflow:hidden;background:linear-gradient(#ffb3d9 0%,#c39bff 45%,#6a55d6 100%);border:2px solid var(--line);margin-bottom:12px}
.scene .sun{position:absolute;right:16px;top:8px;font-size:44px;opacity:.85}
.rainbow{position:absolute;left:0;right:0;bottom:0;height:54px;background:linear-gradient(#ff5d5d 0 9px,#ff9f40 9px 18px,#ffd23f 18px 27px,#4cd964 27px 36px,#4aa3ff 36px 45px,#a77bff 45px 54px)}
.uni,.hero,.cloud{position:absolute;bottom:46px;transform:translateX(-50%);font-size:66px;line-height:1}
.cloud{bottom:128px;font-size:70px;transition:opacity .8s}
.cloud .wind{position:absolute;left:-34px;top:20px;font-size:34px;transform:scaleX(-1);opacity:.8}
.cloud.gust .b2{display:inline-block;animation:shake .4s}
.cloud.poof{opacity:0}
.uni .b,.hero .b{display:inline-block;animation:gallop .45s infinite alternate ease-in-out}
.uni .flip{display:inline-block;transform:scaleX(-1)}
.hero.jump .b{animation:hop .4s}
.uni.away{transition:left 1s,opacity 1s;left:110%!important;opacity:0}
@keyframes gallop{to{transform:translateY(-8px) rotate(-4deg)}}
@keyframes hop{50%{transform:translateY(-34px)}}
.hearts{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-size:54px;animation:pop .6s}
.uni-staff{max-width:460px;width:100%;margin:0 auto}
.mode-tog{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.mode-tog button{padding:10px 16px;font-size:17px}
.mode-tog button.on{background:#fff;color:#1d2240}
.mictest{font-size:64px;font-weight:700;text-align:center;color:#1d2240;height:80px}
.me .cn{margin-left:4px;color:var(--gold)}
.habtabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.htab{font-size:17px;padding:8px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.htab.on{background:#fff;color:#1d2240}
.htab.lockd{opacity:.55}
.hab{position:relative;height:52vh;min-height:330px;border-radius:26px;overflow:hidden;border:3px solid rgba(255,255,255,.3);box-shadow:inset 0 0 50px rgba(0,0,0,.18)}
.pet{position:absolute;transform:translate(-50%,-100%);transition:left 2.4s ease-in-out,top 2.4s ease-in-out;text-align:center;z-index:3;cursor:pointer}
.pet .pi{font-size:60px;line-height:1;display:inline-block;transition:transform .3s}
.pet .pn{font-size:13px;font-weight:600;color:#1d2240;background:rgba(255,255,255,.8);border-radius:8px;padding:0 6px;display:inline-block}
.pet.sleepy .pi{filter:grayscale(.55) brightness(.85)}
.pet .zz{position:absolute;right:-12px;top:-8px;font-size:22px}
.pet .bub{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:2px 8px;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.2);animation:bob 1.6s infinite ease-in-out}
.mess{position:absolute;font-size:36px;transform:translate(-50%,-50%);z-index:2;cursor:pointer;animation:wig 2.4s infinite;transition:opacity .25s,transform .25s}
.mess.gone{opacity:0;transform:translate(-50%,-90%) scale(1.5)}
.deco{position:absolute;font-size:48px;line-height:1;transform:translate(-50%,-100%);z-index:1;touch-action:none}
.decomode .deco{outline:2px dashed rgba(255,255,255,.9);border-radius:10px;cursor:grab;z-index:4}
.decomode .pet,.decomode .mess{pointer-events:none;opacity:.6}
.tray-h{font-size:15px;color:var(--dim);margin:10px 0 6px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.tray{display:flex;gap:8px;overflow-x:auto;padding:10px;background:var(--card);border-radius:18px}
.tray button{font-size:36px;min-width:66px;height:70px;border-radius:14px;background:rgba(255,255,255,.12);position:relative;flex:none}
.tray button small{position:absolute;left:0;right:0;bottom:1px;font-size:11px;color:#fff}
.hab-actions{margin-top:14px}
.btn.play{font-size:26px;padding:16px 42px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sitem{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.sitem .ic{font-size:48px;line-height:1.2}
.sitem .nm{font-weight:600;font-size:17px}
.sitem .pr{color:var(--gold);font-weight:700;margin:2px 0 4px}
.sitem.dis{opacity:.55}
.sub2{font-size:13px;color:var(--dim)}
.ovc.sheet{max-height:92vh;overflow:auto}
.sheet .big{font-size:92px;line-height:1.1;position:relative}
.mini{font-size:20px;vertical-align:middle}
.nb{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:8px 0;text-align:left;font-size:16px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 10px}
.acts button{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 4px;font-size:15px;line-height:1.4}
.acts button.need{opacity:.5}
.foods{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.foods button{font-size:30px;background:#fff;color:#222;border-radius:14px;padding:6px 10px;position:relative}
.foods button:disabled{opacity:.4}
.foods button small{font-size:13px}
.foods .fav{position:absolute;top:-8px;right:-6px;font-size:14px}
.coinpop{position:fixed;right:24px;top:58px;font-weight:700;color:var(--gold);font-size:22px;z-index:80;animation:rise2 1s forwards;pointer-events:none}
@keyframes rise2{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes wig{50%{transform:translate(-50%,-50%) rotate(7deg)}}
textarea.code{width:100%;height:110px;margin-top:10px;font-family:monospace;font-size:12px;border-radius:12px;border:2px solid #d5d9e8;padding:8px;user-select:text;-webkit-user-select:text}

/* ================= Notation drawing ================= */
const TREBLE_PATH='M14,33 C9,33 8,27 12,25 C17,22 23,27 20,34 C17,41 5,40 4,31 C3,22 15,15 18,6 C20,-2 18,-11 14,-12 C10,-13 9,-4 10,4 L15,47 C16,53 10,56 7,52';
function clefSVG(clef,x,y,s){
  const k=s/10;
  if(clef==='treble') return `<g transform="translate(${x},${y}) scale(${k})"><path d="${TREBLE_PATH}" fill="none" stroke="#222" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="50.5" r="2.9" fill="#222"/></g>`;
  return `<g transform="translate(${x},${y}) scale(${k})"><circle cx="5" cy="10" r="3.8" fill="#222"/><path d="M3,10 C3,1 13,-1 18,3 C24,8 23,20 15,28 C11,32 6,35 1,37" fill="none" stroke="#222" stroke-width="3.2" stroke-linecap="round"/><circle cx="27" cy="6" r="2.1" fill="#222"/><circle cx="27" cy="14" r="2.1" fill="#222"/></g>`;
}
function typeFor(b){return b>=4?'whole':b>=3?'dhalf':b>=2?'half':'quarter'}
/* o: {clef, s, width, notes:[{note,staff,x,type,color,letter:opacity,glow,i}], clefX, ts, bars:[x], final, topPad, botPad, gap, lineStart} */
function staffSVG(o){
  const s=o.s, W=o.width, sw=Math.max(1,s*.09);
  const top=o.topPad??3*s, gap=o.gap??3.6*s;
  const staves=o.clef==='grand'?[{clef:'treble',y:top},{clef:'bass',y:top+4*s+gap}]:[{clef:o.clef,y:top}];
  const H=staves[staves.length-1].y+4*s+(o.botPad??3*s);
  const x0=o.lineStart??(o.clef==='grand'?s*1.1:4), x1=W-4;
  let g=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="nsvg" style="max-width:100%;height:auto" font-family="Fredoka,Arial,sans-serif">`;
  for(const st of staves){for(let i=0;i<5;i++){const y=st.y+i*s;g+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="#333" stroke-width="${sw}"/>`;}
    g+=`<line x1="${x0}" x2="${x0}" y1="${st.y}" y2="${st.y+4*s}" stroke="#333" stroke-width="${sw*1.3}"/>`;
    g+=clefSVG(st.clef,(o.clefX??(x0+s*.4)),st.y,s);
    if(o.ts){const tx=(o.clefX??(x0+s*.4))+s*4.1;g+=`<text x="${tx}" y="${st.y+1.85*s}" font-size="${2.25*s}" font-weight="700" text-anchor="middle" font-family="Georgia,serif" fill="#222">${o.ts}</text><text x="${tx}" y="${st.y+3.85*s}" font-size="${2.25*s}" font-weight="700" text-anchor="middle" font-family="Georgia,serif" fill="#222">4</text>`;}
  }
  if(staves.length===2){const yA=staves[0].y,yB=staves[1].y+4*s;
    g+=`<line x1="${x0}" x2="${x0}" y1="${yA}" y2="${yB}" stroke="#333" stroke-width="${sw*1.3}"/>`;
    g+=`<path d="M${x0-2},${yA} C${x0-2-s*.9},${yA+s} ${x0-2},${(yA+yB)/2-s} ${x0-2-s*.8},${(yA+yB)/2} C${x0-2},${(yA+yB)/2+s} ${x0-2-s*.9},${yB-s} ${x0-2},${yB}" fill="none" stroke="#333" stroke-width="${sw*2}"/>`;}
  for(const bx of (o.bars||[])){const yA=staves[0].y,yB=staves[staves.length-1].y+4*s;g+=`<line x1="${bx}" x2="${bx}" y1="${yA}" y2="${yB}" stroke="#333" stroke-width="${sw}"/>`;}
  if(o.final){const yA=staves[0].y,yB=staves[staves.length-1].y+4*s;g+=`<line x1="${x1-s*.5}" x2="${x1-s*.5}" y1="${yA}" y2="${yB}" stroke="#333" stroke-width="${sw}"/><line x1="${x1-s*.15}" x2="${x1-s*.15}" y1="${yA}" y2="${yB}" stroke="#333" stroke-width="${sw*3}"/>`;}
  for(const n of (o.notes||[])){
    const st=staves.find(z=>z.clef===n.staff)||staves[0];
    const p=posOf(n.note,st.clef), yOf=q=>st.y+4*s-q*s/2, y=yOf(p), x=n.x;
    const type=n.type||'whole', whole=type==='whole';
    const rx=whole?.8*s:.68*s, ry=whole?.56*s:.5*s, col=n.color||'#222';
    let h=`<g class="nh" data-i="${n.i??''}">`;
    if(n.glow) h+=`<circle cx="${x}" cy="${y}" r="${1.35*s}" fill="${n.glow}" opacity=".35"/>`;
    const lw=rx*1.55;
    if(p<=-2) for(let q=-2;q>=p;q-=2) h+=`<line x1="${x-lw}" x2="${x+lw}" y1="${yOf(q)}" y2="${yOf(q)}" stroke="#333" stroke-width="${sw}"/>`;
    if(p>=10) for(let q=10;q<=p;q+=2) h+=`<line x1="${x-lw}" x2="${x+lw}" y1="${yOf(q)}" y2="${yOf(q)}" stroke="#333" stroke-width="${sw}"/>`;
    const filled=type==='quarter';
    if(!whole){const up=p<4;const sx=up?x+rx*.92:x-rx*.92;h+=`<line x1="${sx}" x2="${sx}" y1="${y}" y2="${up?y-3.4*s:y+3.4*s}" stroke="${col}" stroke-width="${sw*1.4}"/>`;}
    h+=`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${whole?-12:-20} ${x} ${y})" fill="${filled?col:(n.fill||'#fff')}" stroke="${col}" stroke-width="${whole?s*.17:s*.14}"/>`;
    if(type==='dhalf'){const dy=(p%2===0)?y-s/2:y;h+=`<circle cx="${x+rx+.5*s}" cy="${dy}" r="${.17*s}" fill="${col}"/>`;}
    if(n.letter>0) h+=`<text x="${x}" y="${y+s*.22}" font-size="${(whole?.66:.6)*s}" font-weight="700" text-anchor="middle" fill="${filled?'#fff':'#222'}" opacity="${n.letter}">${n.note[0]}</text>`;
    if(n.mark) h+=`<text x="${x}" y="${staves[0].y-1.9*s}" font-size="${.8*s}" text-anchor="middle" fill="${n.markColor||'#0c8f6a'}" font-weight="700">${n.mark}</text>`;
    h+='</g>';g+=h;
  }
  return g+'</svg>';
}
function staffFor(note,level){
  if(level.staff!=='grand') return level.staff;
  if(note==='C4'&&level.id==='L4') return Math.random()<.5?'treble':'bass';
  return midiOf(note)>=60?'treble':'bass';
}
/* rhythm line: measures = [[beats...],...] */
function rhythmSVG(measures,bpm,opt={}){
  const W=640,H=opt.counts===false?110:140,ly=72,s=14,mStart=58,mw=(W-mStart-8)/measures.length,pad=26;
  let g=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto" font-family="Fredoka,Arial,sans-serif">`;
  g+=`<line x1="6" x2="${W-6}" y1="${ly}" y2="${ly}" stroke="#333" stroke-width="2"/>`;
  g+=`<text x="30" y="${ly-6}" font-size="34" font-weight="700" text-anchor="middle" font-family="Georgia,serif">${bpm}</text><text x="30" y="${ly+28}" font-size="34" font-weight="700" text-anchor="middle" font-family="Georgia,serif">4</text>`;
  const xs=[];const beatX=b=>{const m=Math.min(Math.floor(b/bpm),measures.length-1);const off=b-m*bpm;return mStart+m*mw+pad+(off/bpm)*(mw-2*pad)};
  measures.forEach((ms,mi)=>{const x0=mStart+mi*mw;g+=`<line x1="${x0+mw}" x2="${x0+mw}" y1="${ly-22}" y2="${ly+22}" stroke="#333" stroke-width="${mi===measures.length-1?5:2}"/>`;
    let off=0;ms.forEach(b=>{const x=beatX(mi*bpm+off);const t=typeFor(b);const idx=xs.length;xs.push(x);const col=(opt.colors&&opt.colors[idx])||'#222';
      const filled=t==='quarter';
      if(t!=='whole') g+=`<line x1="${x+9}" x2="${x+9}" y1="${ly}" y2="${ly-44}" stroke="${col}" stroke-width="2.6"/>`;
      g+=`<ellipse cx="${x}" cy="${ly}" rx="${t==='whole'?12:10}" ry="${t==='whole'?8.5:7.5}" transform="rotate(-20 ${x} ${ly})" fill="${filled?col:'#fff'}" stroke="${col}" stroke-width="2.6"/>`;
      if(t==='dhalf') g+=`<circle cx="${x+18}" cy="${ly-5}" r="2.6" fill="${col}"/>`;
      if(opt.counts!==false){const lab=[];for(let k=0;k<b;k++)lab.push(off+k+1);g+=`<text x="${x}" y="${ly+50}" font-size="17" text-anchor="start" fill="#6a5acd" font-weight="600">${lab.join(' ')}</text>`;}
      if(opt.marks&&opt.marks[idx]) g+=`<text x="${x}" y="${ly-54}" font-size="22" text-anchor="middle">${opt.marks[idx]}</text>`;
      off+=b;});
  });
  return {svg:g+'</svg>',xs,beatX,W};
}
function noteValueSVG(b){
  const t=typeFor(b);const filled=t==='quarter';
  return `<svg viewBox="0 0 120 140" width="130" height="150"><line x1="10" x2="110" y1="100" y2="100" stroke="#ccc" stroke-width="2"/>${t!=='whole'?`<line x1="71" x2="71" y1="100" y2="22" stroke="#222" stroke-width="5"/>`:''}<ellipse cx="55" cy="100" rx="${t==='whole'?24:19}" ry="${t==='whole'?16:14}" transform="rotate(-20 55 100)" fill="${filled?'#222':'#fff'}" stroke="#222" stroke-width="5"/>${t==='dhalf'?'<circle cx="92" cy="92" r="5" fill="#222"/>':''}</svg>`;
}
const VALUE_NAME={1:'Quarter note',2:'Half note',3:'Dotted half note',4:'Whole note'};

/* ================= Audio ================= */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function soundOn(){return S.settings.sound!==false}
function playMidi(m,dur=1.1,when=0,vol=.32){const a=ac();if(!a||!soundOn())return;const t=a.currentTime+when+.01;const f=440*Math.pow(2,(m-69)/12);
  const out=a.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(vol,t+.008);out.gain.exponentialRampToValueAtTime(vol*.35,t+.25);out.gain.exponentialRampToValueAtTime(.0005,t+dur);
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(9000,f*7);out.connect(lp);lp.connect(a.destination);
  [[1,1],[2,.42],[3,.18],[4,.08],[5,.04]].forEach(([h,amp])=>{const o=a.createOscillator();const gg=a.createGain();o.type='sine';o.frequency.value=f*h*(1+(h-1)*.0007);gg.gain.value=amp;o.connect(gg);gg.connect(out);o.start(t);o.stop(t+dur+.05)});
  Mic.muteUntil=Math.max(Mic.muteUntil,(t+dur*.6));
}
function playNote(n,dur,when){playMidi(midiOf(n),dur,when)}
function sfxGood(){playMidi(84,.35,0,.18);playMidi(88,.45,.09,.18)}
function sfxBad(){const a=ac();if(!a||!soundOn())return;const t=a.currentTime;const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(110,t+.22);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.3)}
let NOISE=null;function noiseBuf(a){if(!NOISE){NOISE=a.createBuffer(1,a.sampleRate*.05,a.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}return NOISE}
function clickAt(t,accent,soft){const a=ac();if(!a||!soundOn())return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(accent?1750:1250,t);o.frequency.exponentialRampToValueAtTime(accent?1000:700,t+.05);
  const v=(soft?.22:.32)*(accent?1.25:1);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.002);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.1);
  const n=a.createBufferSource();n.buffer=noiseBuf(a);const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=accent?3000:2200;const ng=a.createGain();ng.gain.value=v*.6;n.connect(bp);bp.connect(ng);ng.connect(a.destination);n.start(t)}
function click(when,accent){const a=ac();if(!a)return;clickAt(a.currentTime+when,accent)}
let holdNode=null;
function holdStart(){holdStop();const a=ac();if(!a||!soundOn())return;const t=a.currentTime;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.012);g.connect(a.destination);
  const o=a.createOscillator();o.type='triangle';o.frequency.value=523.25;o.connect(g);const o2=a.createOscillator();o2.type='sine';o2.frequency.value=1046.5;const g2=a.createGain();g2.gain.value=.35;o2.connect(g2);g2.connect(g);o.start(t);o2.start(t);holdNode={o,o2,g}}
function holdStop(){if(!holdNode)return;const a=ac();const t=a.currentTime;const {o,o2,g}=holdNode;try{g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+.05);o.stop(t+.07);o2.stop(t+.07)}catch(e){}holdNode=null}

/* ================= Microphone (works only where the browser allows it) ================= */
const Mic={on:false,stream:null,an:null,buf:null,timer:null,cb:null,last:null,count:0,fired:false,muteUntil:0,
  possible(){try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext)return false;const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature&&!pp.allowsFeature('microphone'))return false;return true}catch(e){return false}},
  async start(cb){this.cb=cb;if(this.on)return true;try{const a=ac();this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      const src=a.createMediaStreamSource(this.stream);this.an=a.createAnalyser();this.an.fftSize=2048;src.connect(this.an);this.buf=new Float32Array(this.an.fftSize);this.on=true;
      this.timer=setInterval(()=>this.tick(),60);return true}catch(e){this.on=false;return false}},
  tick(){if(!this.an)return;const a=ac();if(a.currentTime<this.muteUntil){this.last=null;this.count=0;return}
    this.an.getFloatTimeDomainData(this.buf);const f=autoCorrelate(this.buf,a.sampleRate);
    if(f>60&&f<1400){const m=Math.round(12*Math.log2(f/440)+69);if(m===this.last){this.count++}else{this.last=m;this.count=1;this.fired=false}
      if(this.count>=3&&!this.fired){this.fired=true;this.cb&&this.cb(m)}}else{this.last=null;this.count=0;this.fired=false}},
  stop(){clearInterval(this.timer);this.timer=null;if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;this.an=null;this.on=false;this.cb=null}
};
function autoCorrelate(buf,sr){let SIZE=buf.length,rms=0;for(let i=0;i<SIZE;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/SIZE);if(rms<.012)return -1;
  let r1=0,r2=SIZE-1;const th=.2;for(let i=0;i<SIZE/2;i++)if(Math.abs(buf[i])<th){r1=i;break}for(let i=1;i<SIZE/2;i++)if(Math.abs(buf[SIZE-i])<th){r2=SIZE-i;break}
  const b=buf.slice(r1,r2);SIZE=b.length;const c=new Float32Array(SIZE);for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE-i;j++)c[i]+=b[j]*b[j+i];
  let d=0;while(d<SIZE-1&&c[d]>c[d+1])d++;let mv=-1,mp=-1;for(let i=d;i<SIZE;i++)if(c[i]>mv){mv=c[i];mp=i}if(mp<1||mp>=SIZE-1)return -1;
  const x1=c[mp-1],x2=c[mp],x3=c[mp+1],A=(x1+x3-2*x2)/2,B=(x3-x1)/2;const T=A?mp-B/(2*A):mp;return sr/T}

VIEWS.drill=(arg)=>{const [lid,mode]=arg.split(':');const L=lvl(lid);const items=levelItems(L);const TOTAL=10;

  function drawProg(){$('#prog').innerHTML=Array.from({length:TOTAL},(_,i)=>`<i class="${i<q?(results[i]?'done':'miss'):i===q?'cur':''}"></i>`).join('')}

  function answer(ok,el){if(busy)return;const k=nkey(item.note,item.staff);

  function finish(){const stars=first>=9?3:first>=7?2:1;const sticker=finishRound(lid+':'+mode,stars,mode,lid,first,TOTAL,t0);

  if(mode==='name')app.querySelectorAll('.lb').forEach(b=>b.addEventListener('click',()=>{app.querySelectorAll('.lb').forEach(x=>x.classList.remove('reveal'));answer(b.dataset.l===item.note[0],b)}));

const RPAT={4:[[1,1,1,1],[2,2],[4],[1,1,2],[2,1,1],[1,2,1],[3,1],[1,3]],3:[[1,1,1],[3],[2,1],[1,2]]};
VIEWS.tap=()=>{const ROUNDS=5,BPM=66,spb=60/BPM;let r=0,pts=0,notesTot=0;const t0=Date.now();
  let raf=0,state='idle',pat=null,bpm=4,start=0,presses=[],downAt=null,onsets=[],durs=[],totalBeats=8,lat=0,X0=62,X1=624,unit=1;
  app.innerHTML=`${topBar('🥁 Tap Along','rhythm')}<div class="prog" id="prog"></div><div class="paper" id="rp"><div id="rs"></div></div>
   <div class="count" id="ct"></div><button class="holdbtn" id="hb"><span>HOLD</span></button>
   <div class="row" style="margin-top:26px"><button class="btn" id="startB">▶ Start</button></div>

      g+=`<ellipse cx="${x}" cy="70" rx="${t==='whole'?12:10}" ry="${t==='whole'?8.5:7.5}" transform="rotate(-20 ${x} 70)" fill="${filled?'#222':'#fff'}" stroke="#222" stroke-width="2.6"/>`;
      if(t==='dhalf')g+=`<circle cx="${x+18}" cy="65" r="2.6" fill="#222"/>`;
      const bx=xb(b)+5,bw=d*unit-10;g+=`<rect x="${bx}" y="112" width="${bw}" height="18" rx="9" fill="#e6e1ff"/><rect id="f${i}" x="${bx}" y="112" width="0" height="18" rx="9" fill="#3ee6c4"/>`;

VIEWS.songs=()=>{const p=P();
  app.innerHTML=`${topBar('🎵 Song Station','games')}<div class="grid">${SONGS.map(s=>`<button class="tile" data-go="song|${s.id}"><div class="ic">${s.icon}</div><div class="nm">${s.title}</div><div class="sub">${s.pos}</div><div class="sub">${'🎵'.repeat(s.diff)}</div>${starsHTML(p.stars['song:'+s.id]||0)}</button>`).join('')}</div>`;
};
VIEWS.song=(id)=>{const song=SONGS.find(s=>s.id===id)||SONGS[0];const seq=song.seq;let noteMiss=false,idx=-1,mode='idle',mistakes=0,letters=P().hints!=='never',timers=[],t0=Date.now(),keyHelp=false;
  const meas=[];let cur=[],acc=0;seq.forEach((n,i)=>{cur.push(i);acc+=n.beats;if(acc>=song.ts){meas.push(cur);cur=[];acc=0}});if(cur.length)meas.push(cur);
  const perSys=window.innerWidth<600?2:4;
  app.innerHTML=`${topBar(song.icon+' '+song.title,'songs')}<div class="song-wrap"><div class="paper" id="sp"></div></div>
   <div class="song-ctrl"><button class="btn small alt" id="listen">🔊 Listen</button><button class="btn small" id="playB">🎹 Play along</button><button class="toggle ${letters?'on':''}" id="letT">🔤 Letters</button><button class="toggle" id="keyT">💡 Key help</button>${micButtonHTML()}</div>
   <div class="prompt" id="sMsg" style="font-size:20px">Tap Listen to hear it, or Play along to play it yourself.</div>${keyboardHTML(48,72)}`;
  function render(){const s=16,W=640;let h='';
    for(let si=0;si<meas.length;si+=perSys){const ms=meas.slice(si,si+perSys);const first=si===0;const startX=first?s*6.4:s*4.2;const mw=(W-startX-10)/perSys;const notes=[],bars=[];
      ms.forEach((mi,k)=>{const x0=startX+k*mw;let off=0;mi.forEach(i=>{const n=seq[i];const x=x0+s*1.3+(off/song.ts)*(mw-s*2.2);off+=n.beats;
        const isCur=i===idx;notes.push({note:n.note,staff:song.staff==='grand'?(midiOf(n.note)>=60?'treble':'bass'):'treble',x,type:typeFor(n.beats),letter:letters?1:0,color:isCur?'#e0287a':(i<idx&&mode==='play'?'#0c8f6a':'#222'),glow:isCur?'#ff6fae':null,i})});
        bars.push(x0+mw)});
      h+=staffSVG({clef:song.staff,s,width:W,notes,bars:bars.slice(0,-1),final:si+perSys>=meas.length,ts:first?String(song.ts):null,topPad:s*2.6,botPad:s*2.4,gap:s*3.4});}
    $('#sp').innerHTML=h;const c=$('#sp .nh[data-i="'+idx+'"]');if(c&&mode!=='idle'){const r=c.getBoundingClientRect();if(r.top<70||r.bottom>window.innerHeight*.55)window.scrollBy({top:r.top-120,behavior:'smooth'})}}
  function stopAll(){timers.forEach(clearTimeout);timers=[];mode='idle';$('#listen').textContent='🔊 Listen';$('#playB').textContent='🎹 Play along'}
  function hintKey(){document.querySelectorAll('.kb .hint').forEach(k=>k.classList.remove('hint'));if(keyHelp&&mode==='play'&&idx>=0&&idx<seq.length){const k=document.querySelector(`.kb [data-midi="${midiOf(seq[idx].note)}"]`);k&&k.classList.add('hint')}}
  $('#listen').addEventListener('click',()=>{if(mode==='listen'){stopAll();idx=-1;render();return}stopAll();mode='listen';$('#listen').textContent='⏹ Stop';const spb=60/96;let t=0;
    seq.forEach((n,i)=>{const at=t;timers.push(setTimeout(()=>{idx=i;playNote(n.note,Math.max(.5,n.beats*spb*.95));flashKey(midiOf(n.note),'press',n.beats*spb*800);render()},at*1000+80));t+=n.beats*spb});
    timers.push(setTimeout(()=>{stopAll();idx=-1;render()},t*1000+400))});
  $('#playB').addEventListener('click',()=>{if(mode==='play'){stopAll();idx=-1;render();hintKey();$('#sMsg').textContent='Tap Listen to hear it, or Play along to play it yourself.';return}stopAll();mode='play';mistakes=0;t0=Date.now();idx=0;$('#playB').textContent='⏹ Stop';$('#sMsg').textContent='Play the pink note!';render();hintKey()});
  $('#letT').addEventListener('click',e=>{letters=!letters;e.currentTarget.classList.toggle('on',letters);render()});
  $('#keyT').addEventListener('click',e=>{keyHelp=!keyHelp;e.currentTarget.classList.toggle('on',keyHelp);hintKey()});
  function got(m,fromMic){if(mode!=='play')return;const want=midiOf(seq[idx].note);const ok=fromMic?micMatch(m,want):m===want;
    if(ok){if(!noteMiss)addCoins(1);noteMiss=false;if(!fromMic)playMidi(want,Math.max(.4,seq[idx].beats*.5));flashKey(want,'good',300);idx++;if(idx>=seq.length){const stars=mistakes<=1?3:mistakes<=4?2:1;mode='idle';hintKey();render();const st=finishRound('song:'+song.id,stars,'song',song.id,seq.length,seq.length+mistakes,t0);
        showResult({stars,title:'You played '+song.title+'!',msg:mistakes?`Only ${mistakes} oops note${mistakes>1?'s':''}!`:'Not a single mistake!',sticker:st,again:()=>go('song',id),done:()=>go('songs')});$('#playB').textContent='🎹 Play along';return}
      render();hintKey()}
    else{noteMiss=true;if(!fromMic)playMidi(m,.35);mistakes++;sfxBad();flashKey(m,'bad',300);$('#sMsg').textContent=`Oops! Look for ${nice(seq[idx].note)}.`;setTimeout(()=>{if(mode==='play')$('#sMsg').textContent='Play the pink note!'},1500)}}
  bindKeyboard(app,(m)=>{if(mode==='play')got(m,false);else playMidi(m,.6)});
  bindMic(m=>got(m,true));
  render();cleanup=()=>{timers.forEach(clearTimeout)};
};

function petInit(p){p.coins=p.coins||0;p.pets=p.pets||[];p.habs=p.habs||[];p.inv=p.inv||{};p.tools=p.tools||[];p.decor=p.decor||[];p.decorInv=p.decorInv||{};p.mess=p.mess||{};p.messT=p.messT||{}}

function addCoins(n){const p=P();if(!p||!n)return;petInit(p);p.coins+=n;roundCoins+=n;const b=$('#coinBadge');if(b)b.textContent=p.coins;
  const d=document.createElement('div');d.className='coinpop';d.textContent='+'+n+' 🪙';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);Store.save()}
function need(pet,k){return Math.max(0,Math.min(100,pet[k]-(Date.now()-pet[k+'T'])/DECAY[k]*100))}
function setNeed(pet,k,v){pet[k]=Math.max(0,Math.min(100,v));pet[k+'T']=Date.now()}
function messList(p,hab){return p.mess[hab]||(p.mess[hab]=[])}
function joyShown(p,pet){return Math.max(0,need(pet,'j')-6*messList(p,pet.hab).length)}
function newPet(spId,name,hab){const now=Date.now();return {id:'a'+now.toString(36)+Math.random().toString(36).slice(2,5),sp:spId,name,hab,h:80,hT:now,j:85,jT:now,c:90,cT:now,meals:0,petT:0}}
function genMess(p,hab){const n=p.pets.filter(x=>x.hab===hab).length;if(!n)return;const iv=5*HR/n,now=Date.now();
  if(!p.messT[hab]){p.messT[hab]=now-iv+20*60e3;Store.save();return}
  const k=Math.floor((now-p.messT[hab])/iv);if(k<=0)return;const list=messList(p,hab);const extra=HABS[hab].mess;
  for(let i=0;i<k&&list.length<8;i++)list.push({id:'m'+now.toString(36)+i+Math.random().toString(36).slice(2,5),i:Math.random()<.6?'💩':extra[Math.floor(Math.random()*extra.length)],x:7+Math.random()*86,y:64+Math.random()*28});
  p.messT[hab]=list.length>=8?now:p.messT[hab]+k*iv;Store.save()}
function namePrompt(def,title,cb){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="ovc"><h2>${title}</h2><input class="txt" id="pn" maxlength="14" value="${esc(def)}" autocomplete="off"><div class="row" style="margin-top:16px"><button class="btn" data-r="ok">Done</button></div></div>`;document.body.appendChild(ov);

    $('#decoDone').addEventListener('click',()=>{deco=false;render();drawTray()})}
  $('#decoB').addEventListener('click',()=>{deco=!deco;render();drawTray()});
  let drag=null;
  el.addEventListener('pointerdown',e=>{if(!deco)return;const d=e.target.closest('.deco');if(!d)return;e.preventDefault();const r=el.getBoundingClientRect();drag={d,id:d.dataset.d,sx:e.clientX,sy:e.clientY,moved:false,r};try{d.setPointerCapture(e.pointerId)}catch(x){}});
  el.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6)drag.moved=true;if(!drag.moved)return;const x=Math.max(3,Math.min(97,(e.clientX-drag.r.left)/drag.r.width*100)),y=Math.max(12,Math.min(99,(e.clientY-drag.r.top)/drag.r.height*100+6));drag.d.style.left=x+'%';drag.d.style.top=y+'%';drag.x=x;drag.y=y});
  el.addEventListener('pointerup',()=>{if(!drag)return;const it=p.decor.find(z=>z.id===drag.id);if(it){if(drag.moved&&drag.x!=null){it.x=drag.x;it.y=drag.y}else{p.decor=p.decor.filter(z=>z!==it);if(it.src==='shop')p.decorInv[it.i]=(p.decorInv[it.i]||0)+1}}Store.save();drag=null;render();drawTray()});
};
function petSheet(pet,after){const p=P();const ov=document.createElement('div');ov.className='ov';document.body.appendChild(ov);let sub='';
  function draw(){const s=SPM[pet.sp];const tool=CLEAN_TOOL[pet.hab];
    const bars=[['🍽️','Full','h'],['🎾','Happy','j'],['🧼','Clean','c']].map(([i,n,k])=>{const v=Math.round(k==='j'?joyShown(p,pet):need(pet,k));return `<div class="nb"><span>${i} ${n}</span><div class="bar"><i style="width:${v}%;background:${v>60?'#2bbf7a':v>30?'#f5b700':'#ff5d7a'}"></i></div></div>`}).join('');
    let subH='';
    if(sub==='feed'){const foods=s.diet;const have=foods.filter(f=>(p.inv[f]||0)>0);
      subH=`<div class="foods">${foods.map(f=>`<button data-f="${f}" ${(p.inv[f]||0)?'':'disabled'}>${FOODS[f].i}${f===s.fav?'<b class="fav">❤️</b>':''}<small> ×${p.inv[f]||0}</small></button>`).join('')}</div>${have.length?`<div class="note-tip">❤️ = ${esc(pet.name)}’s favorite</div>`:`<div class="note-tip">No food ${esc(pet.name)} eats. Buy ${foods.map(f=>FOODS[f].i).join(' ')} in the shop!</div><button class="btn small alt" data-a="shop">🛒 Go to shop</button>`}`}
    const hasToy=p.tools.includes('toy'),hasTool=p.tools.includes(tool);
    ov.innerHTML=`<div class="ovc sheet"><div class="big" id="pbig">${petIcon(s)}</div><h2>${esc(pet.name)} <button class="mini" data-a="rn">✏️</button></h2><div class="sub2">${s.n} · ${rarity(s.c||2000)}${pet.sp==='caterpillar'?` · ${8-pet.meals} more meals until it becomes a butterfly!`:''}</div>${bars}
      <div class="acts"><button data-a="feed">🍽️<br>Feed</button><button data-a="play" class="${hasToy?'':'need'}">🎾<br>Play</button><button data-a="clean" class="${hasTool?'':'need'}">${TOOLS[tool].i}<br>Clean</button><button data-a="pet">🤚<br>Pet</button></div>${subH}<div class="note-tip" id="sMsg"></div><button class="btn" data-a="close" style="margin-top:10px">Close</button></div>`}
  const msg=t=>{const m=ov.querySelector('#sMsg');if(m)m.textContent=t};
  draw();
  ov.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){const id=f.dataset.f;if(!(p.inv[id]>0))return;const s=SPM[pet.sp];p.inv[id]--;const food=FOODS[id];
      setNeed(pet,'h',need(pet,'h')+food.v+(id===s.fav?10:0));if(food.j||id===s.fav)setNeed(pet,'j',need(pet,'j')+(food.j||0)+(id===s.fav?15:0));pet.meals=(pet.meals||0)+1;
      let evolved=false;if(pet.sp==='caterpillar'&&pet.meals>=8){pet.sp='butterfly';evolved=true}
      Store.save();draw();hearts(ov.querySelector('#pbig'));sfxGood();msg(evolved?'🎉 Your caterpillar turned into a butterfly!':id===s.fav?'Yum! That’s the favorite!':'Yum!');if(evolved)confetti();return}
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;const tool=CLEAN_TOOL[pet.hab];
    if(a==='close'){ov.remove();after&&after();return}
    if(a==='shop'){ov.remove();go('shop','food');return}
    if(a==='rn'){namePrompt(pet.name,'Rename',v=>{pet.name=v;Store.save();draw()});return}
    if(a==='feed'){sub=sub==='feed'?'':'feed';draw();return}
    if(a==='play'){if(!p.tools.includes('toy')){msg('Buy a 🎾 play ball in the shop to play!');return}setNeed(pet,'j',need(pet,'j')+40);Store.save();draw();hearts(ov.querySelector('#pbig'));playMidi(79,.2);playMidi(84,.25,.1);msg('So fun!');return}
    if(a==='clean'){if(!p.tools.includes(tool)){msg(`Buy the ${TOOLS[tool].i} ${TOOLS[tool].n.toLowerCase()} in the shop to clean ${esc(pet.name)}.`);return}setNeed(pet,'c',need(pet,'c')+60);Store.save();draw();hearts(ov.querySelector('#pbig'));playMidi(88,.3,0,.15);msg('Squeaky clean! ✨');return}
    if(a==='pet'){if(Date.now()-(pet.petT||0)<10*60e3){hearts(ov.querySelector('#pbig'));msg(`${esc(pet.name)} loves you!`);return}pet.petT=Date.now();setNeed(pet,'j',need(pet,'j')+8);Store.save();draw();hearts(ov.querySelector('#pbig'));msg(`${esc(pet.name)} loves you!`)}});
}
VIEWS.shop=(tab)=>{const p=P();petInit(p);tab=tab||'food';
  function card(ic,nm,price,id,kind,extra){const can=p.coins>=price;return `<div class="sitem ${can?'':'dis'}"><div class="ic">${ic}</div><div class="nm">${nm}</div>${extra||''}<div class="pr">🪙 ${price}</div><button class="btn small ${can?'':'ghost'}" data-buy="${kind}|${id}">${can?'Buy':'Need '+(price-p.coins)+' more'}</button></div>`}
  function draw(){let h='';
    if(tab==='food')h=Object.entries(FOODS).map(([id,f])=>card(f.i,f.n,f.c,id,'food',`<div class="sub2">You have ${p.inv[id]||0}</div>`)).join('');
    if(tab==='pets')h=HAB_ORDER.map(hab=>`<div class="sec-h" style="grid-column:1/-1">${HABS[hab].i} ${HABS[hab].n}${p.habs.includes(hab)?` · ${p.pets.filter(x=>x.hab===hab).length}/${MAX_PETS} pets`:' · 🔒 buy this habitat first'}</div>`+SPECIES.filter(s=>s.hab===hab&&!s.hidden).map(s=>p.habs.includes(hab)?card(petIcon(s),s.n,s.c,s.id,'pet',`<div class="sub2">${rarity(s.c)}${s.id==='caterpillar'?' · grows into 🦋':''}</div>`):`<div class="sitem dis"><div class="ic">${petIcon(s)}</div><div class="nm">${s.n}</div><div class="pr">🪙 ${s.c}</div><div class="sub2">Needs the ${HABS[hab].n}</div></div>`).join('')).join('');
    if(tab==='decor')h=DECOR.map(([i,n,c])=>card(i,n,c,i,'decor',`<div class="sub2">You have ${(p.decorInv[i]||0)+p.decor.filter(d=>d.i===i&&d.src==='shop').length}</div>`)).join('');
    if(tab==='tools')h=Object.entries(TOOLS).map(([id,t])=>p.tools.includes(id)?`<div class="sitem"><div class="ic">${t.i}</div><div class="nm">${t.n}</div><div class="sub2">${t.d}</div><div class="pr">✅ Owned</div></div>`:card(t.i,t.n,t.c,id,'tool',`<div class="sub2">${t.d}</div>`)).join('');
    if(tab==='habs')h=HAB_ORDER.map(hab=>p.habs.includes(hab)?`<div class="sitem"><div class="ic">${HABS[hab].i}</div><div class="nm">${HABS[hab].n}</div><div class="pr">✅ Yours</div></div>`:card(HABS[hab].i,HABS[hab].n,HABS[hab].c,hab,'hab',`<div class="sub2">${SPECIES.filter(s=>s.hab===hab&&!s.hidden).map(s=>petIcon(s)).join('')}</div>`)).join('');
    app.innerHTML=`${topBar('🛒 Shop','home')}<div class="tabs">${[['food','🍎 Food'],['pets','🐾 Pets'],['decor','🪴 Decor'],['tools','🧼 Care'],['habs','🏡 Habitats']].map(([k,l])=>`<button class="tab ${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('')}</div><div class="shop-grid">${h}</div>`;
    app.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;draw()}));
    app.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>buy(...b.dataset.buy.split('|'))))}
  function pay(c){if(p.coins<c){toast('Not enough coins yet. Play a game to earn more! 🎵');return false}p.coins-=c;return true}
  function buy(kind,id){
    if(kind==='food'){if(!pay(FOODS[id].c))return;p.inv[id]=(p.inv[id]||0)+1;toast(FOODS[id].i+' added to your food!',1200)}
    if(kind==='decor'){const d=DECOR.find(x=>x[0]===id);if(!pay(d[2]))return;p.decorInv[id]=(p.decorInv[id]||0)+1;toast(id+' ready to place. Tap 🎨 Decorate at home!',1800)}
    if(kind==='tool'){if(!pay(TOOLS[id].c))return;p.tools.push(id);toast(TOOLS[id].i+' is yours!',1500)}
    if(kind==='hab'){if(!pay(HABS[id].c))return;p.habs.push(id);p.curHab=id;Store.save();confetti();toast('🎉 The '+HABS[id].n+' is yours! Adopt a pet for it.',2500);tab='pets'}
    if(kind==='pet'){const s=SPM[id];if(p.pets.filter(x=>x.hab===s.hab).length>=MAX_PETS){toast('That habitat is full!');return}if(p.coins<s.c){toast('Not enough coins yet!');return}
      namePrompt(s.n,'Name your new '+s.n.toLowerCase(),name=>{if(!pay(s.c))return;p.pets.push(newPet(s.id,name,s.hab));p.curHab=s.hab;Store.save();sfxGood();go('home')});return}
    Store.save();draw()}
  draw();
};

  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push({d,sec:0})}

    const st=document.getElementById('mtS');if(st)st.textContent=ok?'Listening… play a note.':'The microphone was blocked. Check that Chrome is allowed to use it for this site.';

app.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{S.settings.sound=b.dataset.s==='1';Store.save();go('parent',(S.profiles.find(x=>app.querySelector('.tab.on')&&app.querySelector('.tab.on').dataset.p===x.id)||{}).id)}))}

/* ================= Printables builder (used to make the PDFs) ================= */
window.__buildPrintables=function(kind){
  const css=`<style>body{background:#fff!important;margin:0;color:#111;font-family:Fredoka,Arial,sans-serif}#sky,#toast{display:none}#app{max-width:none;padding:0;display:block}.pg{width:8.5in;height:11in;padding:.45in .5in;box-sizing:border-box;page-break-after:always;position:relative;overflow:hidden}.pg h1{font-size:30px;margin:0 0 4px}.pg .sub{font-size:15px;color:#555;margin-bottom:14px}.card{display:grid;grid-template-columns:1fr 1fr;height:2.3in;border:2px dashed #999;border-radius:14px;margin-bottom:.14in;overflow:hidden}.card .f{display:flex;align-items:center;justify-content:center;padding:6px;border-right:2px dashed #bbb}.card .b{display:flex;flex-direction:column;align-items:center;justify-content:center}.card .b .L{font-size:84px;font-weight:700;line-height:1}.card .b .s{font-size:16px;color:#555}.ws{display:grid;grid-template-columns:repeat(3,1fr);gap:.18in}.ws .c{border:2px solid #ddd;border-radius:12px;padding:4px 4px 8px;text-align:center}.ws .box{width:56px;height:46px;border:2.5px solid #333;border-radius:10px;margin:4px auto 0}.name{display:flex;gap:30px;font-size:18px;margin:6px 0 14px}.name span{flex:1;border-bottom:2px solid #333;padding-bottom:2px}.key{position:absolute;bottom:.35in;left:.5in;right:.5in;font-size:11px;color:#999;transform:rotate(180deg);text-align:center}.foot{position:absolute;bottom:.25in;right:.5in;font-size:12px;color:#aaa}</style>`;
  const miniKB=m=>{const whites=[];for(let x=48;x<=72;x++)if(whiteFromMidi(x))whites.push(x);const w=150/whites.length;let s=`<svg viewBox="0 0 152 46" width="190">`;whites.forEach((x,i)=>{s+=`<rect x="${1+i*w}" y="1" width="${w}" height="44" fill="${x===m?'#ffd23f':'#fff'}" stroke="#333" stroke-width="1"/>`});whites.forEach((x,i)=>{const L=whiteFromMidi(x)[0];if('CDFGA'.includes(L)&&x<72)s+=`<rect x="${1+(i+1)*w-w*.3}" y="1" width="${w*.6}" height="27" fill="#222"/>`});return s+'</svg>'};
  let h=css;
  if(kind==='cards'){
    const cards=[['C3','bass'],['D3','bass'],['E3','bass'],['F3','bass'],['G3','bass'],['A3','bass'],['B3','bass'],['C4','bass'],['C4','treble'],['D4','treble'],['E4','treble'],['F4','treble'],['G4','treble'],['A4','treble'],['B4','treble'],['C5','treble']];
    for(let i=0;i<cards.length;i+=4){h+=`<div class="pg"><h1>🎴 Note Flashcards</h1><div class="sub">Cut along the outside, fold on the middle line. Note on one side, answer on the other.</div>`;
      cards.slice(i,i+4).forEach(([n,st])=>{h+=`<div class="card"><div class="f">${staffSVG({clef:st,s:15,width:230,clefX:8,topPad:40,botPad:40,notes:[{note:n,staff:st,x:150,type:'whole',letter:0}]})}</div><div class="b"><div class="L">${n[0]}</div><div class="s">${n==='C4'?'Middle C':''} ${st==='bass'?'Bass (left hand)':'Treble (right hand)'}</div>${miniKB(midiOf(n))}</div></div>`});
      h+=`<div class="foot">Note Quest</div></div>`}
  }
  if(kind==='sheets'){
    LEVELS.forEach(L=>{const items=levelItems(L);const qs=[];let prev=null;for(let i=0;i<12;i++){let it;do{it=items[Math.floor(Math.random()*items.length)]}while(prev&&it.note===prev.note&&it.staff===prev.staff&&items.length>1);prev=it;qs.push(it)}
      h+=`<div class="pg"><h1>${L.icon} ${L.name}: Name the Notes</h1><div class="sub">${L.desc}. Write the letter name in each box.</div><div class="name"><span>Name:</span><span>Date:</span><span style="flex:.6">Stars: ☆ ☆ ☆</span></div><div class="ws">`;
      qs.forEach(it=>{h+=`<div class="c">${staffSVG({clef:it.staff,s:11,width:170,clefX:6,topPad:30,botPad:28,notes:[{note:it.note,staff:it.staff,x:115,type:'whole',letter:0}]})}<div class="box"></div></div>`});
      h+=`</div><div class="key">Answers: ${qs.map((q,i)=>(i+1)+'. '+q.note[0]).join('   ')}</div><div class="foot">Note Quest</div></div>`});
    h+=`<div class="pg"><h1>🥁 Count the Beats</h1><div class="sub">Write how many beats each note gets. Then clap it!</div><div class="name"><span>Name:</span><span>Date:</span></div><div class="ws">`;
    [1,2,4,3,1,2,3,4,2,1,4,3].forEach(b=>{h+=`<div class="c">${noteValueSVG(b)}<div class="box"></div></div>`});h+=`</div><div class="foot">Note Quest</div></div>`;
  }
  if(kind==='songs'||kind==='songs-plain'){
    SONGS.forEach(song=>{const seq=song.seq;const meas=[];let cur=[],acc=0;seq.forEach((n,i)=>{cur.push(n);acc+=n.beats;if(acc>=song.ts){meas.push(cur);cur=[];acc=0}});
      h+=`<div class="pg"><h1>${song.icon} ${song.title}</h1><div class="sub">${song.pos}</div>`;const grand=song.staff==='grand';const s=grand?14:17,W=600,perSys=grand?Math.ceil(meas.length/2):Math.max(2,Math.ceil(meas.length/5));
      for(let si=0;si<meas.length;si+=perSys){const ms=meas.slice(si,si+perSys);const first=si===0;const startX=first?s*6.4:s*4.2;const mw=(W-startX-10)/perSys;const notes=[],bars=[];
        ms.forEach((mi,k)=>{const x0=startX+k*mw;let off=0;mi.forEach(n=>{const x=x0+s*1.4+(off/song.ts)*(mw-s*2.4);off+=n.beats;notes.push({note:n.note,staff:song.staff==='grand'?(midiOf(n.note)>=60?'treble':'bass'):'treble',x,type:typeFor(n.beats),letter:kind==='songs'?1:0})});bars.push(x0+mw)});
        h+=`<div style="margin-bottom:${grand?24:14}px">${staffSVG({clef:song.staff,s,width:W,notes,bars:bars.slice(0,-1),final:si+perSys>=meas.length,ts:first?String(song.ts):null,topPad:s*2.4,botPad:s*2.2,gap:s*3.4})}</div>`}
      h+=`<div class="foot">Note Quest${kind==='songs'?' · with letter names':''}</div></div>`});
  }
  document.body.innerHTML=h;
};

/* ================= Boot ================= */
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
Store.loadLocal();
go('profiles');
Store.connect();
</script>
</body>
</html>
